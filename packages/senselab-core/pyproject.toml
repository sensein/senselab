[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "senselab-core"
dynamic = ["version", "dependencies"]
description = "Framework-free core of senselab: data model, kernel and runtime."
license = "Apache-2.0"
requires-python = ">=3.11"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
git_describe_command = "git describe --dirty --tags --long --match '[0-9]*.[0-9]*.[0-9]*'"

[tool.hatch.build]
artifacts = ["/src/**/data/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/senselab_core"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_pin_loader.py"
pin = "senselab-worker"
dependencies = [
  "numpy>=1.23",
  "pydantic>=2,<3",
  "pyyaml",
  "filelock",
  "huggingface-hub>=1.3",
  "soundfile>=0.12"
]

[tool.uv.sources]
senselab-worker = { workspace = true }

[tool.hatch.build.targets.sdist.force-include]
"../../hatch_build_pins.py" = "_shared_hatch_build_pins.py"
