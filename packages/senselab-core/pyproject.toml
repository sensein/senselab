[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "senselab-core"
dynamic = ["version"]
description = "Framework-free core of senselab: data model, kernel and runtime."
license = { file = "../../LICENSE.md" }
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.23",
  "pydantic>=2,<3",
  "pyyaml",
  "filelock",
  "huggingface-hub>=1.3"
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/senselab_core"]

[tool.hatch.metadata.hooks.custom]
path = "../../hatch_build_pins.py"
pin = "senselab-worker"

[tool.uv.sources]
senselab-worker = { workspace = true }
