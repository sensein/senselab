format: tolerance-coverage@1.0
# The coverage a tolerance profile states. A field's tolerance is the largest spread over n calibration items, a
# distribution-free one-sided upper tolerance bound: it covers at least a fraction p of items with probability
# 1 - p^n. Each value carries its derivation; Coverage.policy() refuses an entry without one.

target:
  value: 0.95
  derivation: >-
    The fraction of fresh items a field's tolerance must cover. At 0.95 one held-out item in twenty may exceed a
    field's tolerance by chance, which parity and verify then report as a disagreement; a stricter target needs
    more calibration items for the same confidence (59 at 0.95, 299 at 0.99). This is the rate the bound states,
    not one measured on outputs.

confidence:
  value: 0.95
  derivation: >-
    The probability that the largest of n calibration spreads covers the target fraction. With target 0.95 it
    fixes the calibration size at 59 items (the least n with 1 - 0.95^n >= 0.95). A profile of 12 items, as the
    first speech_to_text and diarize profiles were, states 0.779 coverage at this confidence.
