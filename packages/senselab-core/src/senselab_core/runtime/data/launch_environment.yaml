format: launch-environment@2.0
# The ambient variables a worker or server process inherits, by family. A variable passes when a family names it or
# one of its prefixes, and no `never` entry does. A family with `recorded: true` also enters the launch digest, which
# the context records; the others are plumbing that cannot change a result.
# Derivations: specs/20261030-140022-senselab-2x-api/config-derivations.md, under this file's path.
# Dynamic-linker search paths.
linker: {names: [LD_LIBRARY_PATH], prefixes: [DYLD_], recorded: false}
# Trust roots for TLS.
tls: {names: [SSL_CERT_FILE, SSL_CERT_DIR, REQUESTS_CA_BUNDLE, CURL_CA_BUNDLE], prefixes: [], recorded: false}
# The site proxy, in both spellings.
proxy:
  names: [http_proxy, HTTP_PROXY, https_proxy, HTTPS_PROXY, no_proxy, NO_PROXY, ALL_PROXY, all_proxy]
  prefixes: []
  recorded: false
# The Hub cache, token and offline switch.
hugging_face: {names: [], prefixes: [HF_, HUGGINGFACE_], recorded: false}
# Device selection and CUDA behaviour; recorded.
gpu: {names: [], prefixes: [CUDA_, NVIDIA_], recorded: true}
# Thread counts; recorded.
threads: {names: [], prefixes: [OMP_, MKL_, OPENBLAS_], recorded: true}
# Text decoding of tool output and file names.
locale: {names: [LANG], prefixes: [LC_], recorded: false}
# Home, temporary directory and tool path.
process: {names: [HOME, TMPDIR, PATH], prefixes: [], recorded: false}
# Interpreter and package selection; never passed.
never: {names: [VIRTUAL_ENV], prefixes: [PYTHON, CONDA_]}
