format: equivalence@1
# Measured equivalence classes, per backend: the execution-context fingerprints (`ExecutionContext.fingerprint`)
# whose results `equivalent` reuse treats as interchangeable. Each class carries its fingerprints and the
# derivation that admits them: what was measured, on which inputs, and the agreement observed, or why the
# class holds without measurement. `parse_equivalence` refuses a class without one.
#
# No class has been measured: until one is added here, `equivalent` reuses only a result computed under
# the same fingerprint, as `exact` does. Classes are added from measured agreement, never by hand.
backends: {}
