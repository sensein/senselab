# Derivations: specs/20261030-140022-senselab-2x-api/config-derivations.md, by profile and key.
# The profile's format.
format: execution-profile@2.0
# The packaged profile's name.
name: orcd
# Per task, its stacks best first; empty lets each task's declared backend order decide.
stack_preferences: {}
# Device kinds best first; a node takes the first one its backend declares that a class offers.
devices: [cuda, cpu]
# Per env kind, the directory env trees are built under.
env_roots:
  isolated: ${SENSELAB_ENV_ROOT:-~/orcd/scratch/senselab-2x-venvs}
  server: ${SENSELAB_ENV_ROOT:-~/orcd/scratch/senselab-2x-venvs}/servers
# Env build lease timing and the torch wheel index override (null: probed from the host).
envs:
  lease_stale_after_s: 1200
  server_start_margin_s: 60
  torch_index:
# Allowed hub organisations; null allows those of the catalogue entries.
model_sources:
# Cap on the in-process model cache; null for none.
model_cache_budget_bytes:
# How a transient fault is retried: attempts and the first, doubling, wait.
retry:
  attempts: 3
  first_backoff_s: 1.0
# online, or offline to forbid any fetch.
network: online
# The worker classes nodes are placed on, by name, each with its grant and caps.
resource_classes:
  cpu:
    device: cpu
    cpus: 4
    mem_bytes: 17179869184
    time_s: 21600
    partition: ${CPU_PARTITION}
    max_workers: 32
  cpu:large:
    device: cpu
    cpus: 8
    mem_bytes: 68719476736
    time_s: 21600
    partition: ${CPU_PARTITION}
    max_workers: 8
  gpu:h100:
    device: cuda
    gpu_type: h100
    cpus: 8
    mem_bytes: 103079215104
    time_s: 21600
    partition: ${GPU_PARTITION}
    gres: gpu:h100:1
    max_workers: 4
    memory_cap_bytes: 85899345920
  gpu:
    device: cuda
    cpus: 8
    mem_bytes: 103079215104
    time_s: 21600
    partition: ${GPU_PARTITION}
    gres: gpu:1
    max_workers: 4
# What starts pool workers.
substrate:
  kind: slurm
  qos_cpu_cap:
  exclude_nodes: []
# How pool workers claim, yield, poll and roll index segments.
pool:
  quantum_items: 100
  quantum_s: 300
  poll_s: 30
  segment_items: 10000
# Every lease a pool keeps: seconds after which another process breaks it, and the share of that between renewals.
lease:
  stale_after_s: 300
  renew_fraction: 0.33
# Retries per fault class before an item fails or its env is reported broken.
faults:
  content_attempts: 2
  infrastructure_replacements: 6
  resource_replacements: 1
# A worker's model-load and request timeouts in seconds; null for no bound.
timeouts:
  load_s:
  request_s:
# Seconds a service stays up after its last consumer lease lapsed.
services:
  idle_exit_s: 600
