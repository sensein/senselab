format: store-policy@2.0
# Modes and retention ages of the result store and the data-fetch cache; StorePolicy.load_default() reads them.
# Derivations: specs/20261030-140022-senselab-2x-api/config-derivations.md, under this file's path.

# Committed objects and the directories above them also grant read (and search) to others.
world_readable: false
# Seconds a quarantined entry is kept before `collect` removes it.
quarantine_retention_s: 604800
# Seconds after which a staging directory or download belongs to a crashed writer.
staging_stale_s: 86400
# Least seconds between two collections a `put` starts.
collect_interval_s: 3600
# Most bytes of one measures file a reader takes; a larger file is malformed.
measures_file_bytes_max: 4194304
