format: supervisor-policy@1.0
# How the keeper reads a process's start time. Each value carries its derivation;
# SupervisorPolicy.load_default() refuses an entry without one.

start_time_probe_s:
  value: 5
  derivation: >-
    The keeper runs `ps -o lstart= -p <pid>` on macOS (Linux reads /proc). Over 200 calls on a 10-core
    laptop at load average 4.4 it took a median 2.9 ms and at most 4.8 ms. Five seconds is about a
    thousand times the slowest call, so only a hung or starved `ps` reaches it. A probe that does reads
    as an unknown start time, and an unknown start time kills nothing: a bound set too low leaks a
    process at its owner's death rather than killing a process that reused its pid.
