format: retry-policy@1.0
# How often a call that raised a transient fault (`faults.is_transient`) is tried, and the first wait.
# Each value carries its derivation; RetryPolicy.load_default() refuses an entry without one.

attempts:
  value: 3
  derivation: >-
    Three tries, the value 1.x shipped as the SENSELAB_HF_MAX_RETRIES default. Not measured: no
    failure-rate data for the Hub or a mirror exists in this repository. Three tries bound the extra
    wait at first_backoff_s * 3 before the fault surfaces.

first_backoff_s:
  value: 1.0
  derivation: >-
    One second before the second try, doubling after each further failure; the 1.x schedule
    (1 s, 2 s, 4 s). Not measured: with three attempts, a fault that has not cleared after three
    seconds of waiting surfaces to the caller rather than stalling the run.
