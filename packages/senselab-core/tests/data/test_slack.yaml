# Test slack layered over the packaged orcd profile.
# Derivations: specs/20261030-140022-senselab-2x-api/config-derivations.md, section test_slack.
# Seconds a fake Slurm command that never answers is given before it is killed.
substrate:
  commands:
    timeout_s: 1
# Seconds a test first waits between reads of what its worker processes wrote, and the longest it waits for them.
pool:
  first_poll_s: 0.01
  poll_s: 10
# Test-only values, which the execution profile does not take: the `slack` fixture returns the rest, `slack_tests` these.
tests:
  # Times of the pooled-fit scaling test: the ratio its 10^4-request time may reach over its 10^3-request time, and the runs it takes the best of.
  probe:
    fit_ratio: 50
    timing_repeats: 3
  # Times of the worker-observation tests. first_poll_s, poll_s and presence_refresh_s: a worker's polls and its reuse
  # of what it read of its peers; long_poll_s is a poll the first one must beat, by at most first_bound_s. put_later_s
  # and watch_poll_s: when a test puts an item after the worker started, and how often it looks for its progress.
  observations:
    first_bound_s: 1.0
    put_later_s: 0.1
    watch_poll_s: 0.005
    first_poll_s: 0.01
    poll_s: 0.05
    long_poll_s: 3
    presence_refresh_s: 100
  # Times of the fault-message test's held lease: a staleness the test never reaches, and the wait that gives up on it.
  held_lease:
    stale_after_s: 60
    timeout_s: 0.2
  # Real seconds a thread parked on a lease test's manual clock waits between looks at the event it waits for.
  lease_clock:
    poll_s: 0.0005
  # Times of the probe-queue tests: the lease's staleness and beat, and how long a stand-in peer process lives.
  probe_queue:
    stale_after_s: 0.4
    renew_fraction: 0.25
    peer_lifetime_s: 60
