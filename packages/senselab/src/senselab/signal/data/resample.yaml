stopband_attenuation_db: 80.0
transition_fraction: 0.1
max_block_elements: 4194304
ripple_margin: 1.2
derivations:
  kaiser: >-
    Window shape beta and length follow Kaiser's design formulas (Kaiser and Schafer 1980, IEEE Trans. ASSP 28(1)):
    beta = 0.1102 (A - 8.7) for A > 50, 0.5842 (A - 21)^0.4 + 0.07886 (A - 21) for 21 <= A <= 50, else 0;
    taps = (A - 7.95) / (14.36 * width) for transition width in cycles per sample.
  stopband_attenuation_db: >-
    The Kaiser design target A: the filter's stop band lies at least this far below its pass band, and its
    pass-band ripple is at most -20*log10(1 - delta) dB with delta = 10**(-A/20), the single
    ripple a Kaiser-windowed sinc has in both bands. 80 dB puts delta at 1e-4, a ripple of 0.00087 dB and
    an aliasing floor below the 16-bit quantisation floor of 98 dB relative to full scale for content within
    18 dB of full scale; it is a design choice, not a fit to any recording.
  transition_fraction: >-
    The transition band's width as a fraction of the lower of the two Nyquist frequencies. It ends at that
    Nyquist (the stop-band edge) and starts below it, so a component that aliases lands at or above the
    pass-band edge and is attenuated by A. 0.1 keeps the pass band flat to 90 % of the lower Nyquist
    (14.4 kHz of 16 kHz audio resampled to 32 kHz) at about 16 000 taps for 44.1 to 48 kHz.
  ripple_margin: >-
    The factor by which the realised filter's worst ripple, in either band, may exceed the Kaiser target delta.
    Kaiser's length and beta formulas are an approximation and `ceil` rounds the length up; measured on the
    FFT of the taps of every pair of 8000, 11025, 16000, 22050, 32000, 44100 and 48000 Hz, the worst pass-band
    deviation is 1.160 delta (16000 to 48000 Hz) and the worst stop-band peak 1.040 delta. 1.2 bounds both.
  max_block_elements: >-
    The most (channels x outputs x taps) values one gather holds at once, 2**22 float64 values (32 MiB):
    a memory bound that changes no output.
