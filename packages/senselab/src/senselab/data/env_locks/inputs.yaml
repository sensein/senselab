format: env-lock-inputs@1.0
# What each lock beside this file is compiled from; scripts/lock_envs.py reads it. `max_cuda` is the CUDA index
# ceiling (omitted: the default); `exclude_newer` is the pinned upload cutoff of the resolution.
quarantine:
  value:
  - lightning!=2.6.2,!=2.6.3
  - pytorch-lightning!=2.6.2,!=2.6.3
  derivation: >-
    PyPI withdrew lightning 2.6.2 and 2.6.3 as malicious; a resolution must never pick them, whichever package
    pulls lightning in. The constraints are part of every lock's digest, so changing them stales every lock.
base_requirements:
  value:
  - numpy
  derivation: >-
    The worker runtime (senselab_worker.codec and every backend's arrays) imports numpy, and the worker overlay
    adds no distribution, so the lock must provide it whether or not the backend requires it.
envs:
  crisperwhisper:
    python: '3.12'
    exclude_newer: '2026-10-02T00:00:00Z'
    requirements:
    - crisperwhisper[transformers]==2.0.1
    - crisperwhisper[ct2]==2.0.1; sys_platform == 'linux' and platform_machine == 'x86_64'
    - ctranslate2>=4.0; sys_platform != 'linux' or platform_machine != 'x86_64'
    - torch>=2.4
    - torchaudio>=2.4
  vllm-server:
    python: '3.12'
    max_cuda: [13, 0]
    exclude_newer: '2026-10-10T00:00:00Z'
    requirements:
    - vllm==0.31.0
  pii-review:
    python: '3.12'
    exclude_newer: '2026-10-02T00:00:00Z'
    requirements:
    - transformers>=5.8
    - torch>=2.8,<2.9
    - accelerate>=1.0
    - compressed-tensors>=0.15
  pyannote:
    python: '3.12'
    exclude_newer: '2026-10-02T00:00:00Z'
    requirements:
    - pyannote.audio>=4.0,<5
    - torch>=2.8
    - torchaudio>=2.8
  speechbrain:
    python: '3.12'
    exclude_newer: '2026-10-02T00:00:00Z'
    requirements:
    - speechbrain>=1.0,<2
    - torch>=2.8
    - torchaudio>=2.8
