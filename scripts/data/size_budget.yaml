format: size-budget@2.0
# Length budgets for Python files tracked under packages/; scripts/check_size_budgets.py reads them.
# Derivations: specs/20261030-140022-senselab-2x-api/config-derivations.md, under this file's path.
# Lines per source file.
src_file_max_lines: 1200
# Lines per test file.
test_file_max_lines: 1300
# Lines per source function.
src_function_max_lines: 100
# Lines per test function.
test_function_max_lines: 100
# A function or file over a limit on purpose, with the reason.
exempt:
- path: packages/senselab-core/src/senselab_core/testing/values.py
  function: _register_kernel_samples
  reason: >-
    A table: one registered sample per kernel value type, 190 lines of literals with no branching. It is
    split by type when a type is added.
- path: packages/senselab/src/senselab/metrics/open_asr/normalizer.py
  function: __init__
  reason: >-
    Vendored reference code, kept diffable against its source: the normaliser's filler-word and contraction tables.
- path: packages/senselab/src/senselab/metrics/open_asr/normalizer.py
  function: process_words
  reason: >-
    Vendored reference code, kept diffable against its source: the number-word state machine.
