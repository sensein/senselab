- {package: nvidia-cuda-runtime, expression: LicenseRef-NVIDIA-Proprietary, source: nvidia_cuda_runtime 13.0.96 wheel METADATA License-Expression, verified: {date: '2026-11-01', how: manual}, reason: Installed metadata and the PyPI release name no license expression.}
