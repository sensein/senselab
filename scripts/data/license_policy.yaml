format: license-policy@1.2
# The license policy for the locked packages the 2.x distributions ship, read by scripts/check_licenses.py.
# A package is allowed when its license expression, and the license of each native library its wheel bundles,
# lies in the union of the named sets its distributions allow. A package that two distributions need must be
# allowed by both. A package with no license record, from any source below, is a failure unless `on_missing` is
# `warn`.

# `raise` fails the gate on a package with no record; `warn` prints it and passes. P-23: raise is the default,
# and a relaxation is a visible edit of this file.
on_missing: raise

# Named license sets. An id is an SPDX identifier or an `id WITH exception` pair; matching ignores case.
sets:
  permissive:
    derivation: >-
      OSI-approved licenses with no copyleft condition on the code that links or imports them: attribution and
      notice only. CC0-1.0 (a public-domain dedication) and 0BSD and Zlib appear because numpy's wheel lists
      them for vendored sources.
    ids: [MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, 0BSD, Apache-2.0, ISC, PSF-2.0, Python-2.0, Unlicense, Zlib, CC0-1.0]
  permissive-other:
    derivation: >-
      Notice-only licenses outside `permissive` that the locked env packages carry: MIT-CMU (pillow), CNRI-Python
      (regex, with Apache-2.0), the LLVM exception to Apache-2.0 (llvmlite, nvtx) and the Repoze BSD-derived license
      (supervisor). None carries a copyleft condition.
    ids: [MIT-CMU, CNRI-Python, Apache-2.0 WITH LLVM-exception, LicenseRef-repoze-bsd-derived]
  vendor-eula:
    derivation: >-
      NVIDIA's end-user agreements for the CUDA runtime libraries and the CUTLASS DSL, which a backend env installs
      at run time as dependencies of torch and vllm and which senselab never redistributes. Proprietary and not
      open source; named so only the env locks, never a shipped distribution, accept it.
    ids: [LicenseRef-NVIDIA-Proprietary, LicenseRef-NVIDIA-Software-License-Agreement]
  runtime-exception:
    derivation: >-
      GPL-3.0-or-later with the GCC Runtime Library Exception, which lets code that is not GPL link the
      compiler's runtime libraries (libgfortran, libgcc_s) that numpy's Linux wheels bundle. The exception removes
      the copyleft condition for the program that uses them.
    ids: [GPL-3.0-or-later WITH GCC-exception-3.1]
  weak-copyleft-ok:
    derivation: >-
      File-level or library-level copyleft: changes to the licensed files, or to the library itself, are shared
      under the same license, and linking from other code is permitted. MPL-2.0 is file-level, LGPL is
      library-level (libsndfile, libquadmath).
    ids: [MPL-2.0, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later]
  copyleft-ok:
    derivation: >-
      Strong copyleft: the GPL and AGPL families. No shipped package may need these today; the set is named so a
      policy can opt in to it.
    ids: [GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later]
  non-commercial-ok:
    derivation: >-
      Licenses that forbid commercial use. Not allowed for any shipped distribution; named so a policy can opt in.
    ids: [CC-BY-NC-4.0, CC-BY-NC-SA-4.0, CC-BY-NC-ND-4.0]

# The sets each distribution allows. Its locked runtime dependencies, transitive ones included, are checked against it.
# `allow_bundled` is the sets for the native libraries a wheel bundles, never for packages; absent, it is `allow`.
distributions:
  senselab-worker:
    allow: [permissive, runtime-exception]
    # numpy bundles libquadmath (LGPL), dynamically linked.
    allow_bundled: [permissive, runtime-exception, weak-copyleft-ok]
  senselab-core:
    allow: [permissive, runtime-exception, weak-copyleft-ok]
  senselab:
    allow: [permissive, runtime-exception, weak-copyleft-ok]
  env-lock:
    allow: [permissive, permissive-other, runtime-exception, weak-copyleft-ok, vendor-eula]

# Spellings of a license in a package's `License` field, and in its trove classifiers, mapped to SPDX.
# The field is used only when it is one line and parses as an expression of known ids or aliases.
aliases:
  BSD 3-Clause License: BSD-3-Clause
  BSD 2-Clause License: BSD-2-Clause
  ISC License: ISC
  MIT License: MIT
  Apache 2.0: Apache-2.0
  Apache License 2.0: Apache-2.0
  Apache 2.0 License: Apache-2.0
  3-Clause BSD License: BSD-3-Clause
  Apache Software License: Apache-2.0
  LGPL-2.1+: LGPL-2.1-or-later
  LGPL-3.0+: LGPL-3.0-or-later
classifiers:
  'License :: OSI Approved :: MIT License': MIT
  'License :: OSI Approved :: BSD License': BSD-3-Clause
  'License :: OSI Approved :: Apache Software License': Apache-2.0
  'License :: OSI Approved :: ISC License (ISCL)': ISC
  'License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)': MPL-2.0
  'License :: OSI Approved :: Python Software Foundation License': PSF-2.0
  'License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)': LGPL-2.1-or-later
  'License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)': LGPL-3.0-or-later
  'License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)': GPL-3.0-or-later
  'License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication': CC0-1.0

# Dated manual records for a package whose installed metadata names no license, or that is not installed on every
# platform (so its metadata is not there to read). A manual record is the fallback and never overrides metadata.
manual:
- {package: pyannote-audio, expression: MIT, source: pyannote_audio 4.0.7 wheel licenses/LICENSE and https://github.com/pyannote/pyannote-audio/blob/main/LICENSE, verified: {date: '2026-11-01', how: manual}, reason: Installed metadata and the PyPI release name no license expression.}
- {package: pyannote-core, expression: MIT, source: https://github.com/pyannote/pyannote-core/blob/main/LICENSE, verified: {date: '2026-11-01', how: manual}, reason: Installed metadata and the PyPI release name no license expression.}
