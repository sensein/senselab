  expression: BSD-3-Clause
  source: https://github.com/tartley/colorama/blob/master/LICENSE.txt
  verified: {date: '2026-11-01', how: manual}
  reason: Installed on Windows only (a tqdm dependency), so the CI environment has no metadata for it.
- package: httpx2-jsfetch
  expression: BSD-3-Clause
  source: https://pypi.org/pypi/httpx2-jsfetch/1.0/json (license_expression BSD-3-Clause)
  verified: {date: '2026-11-01', how: manual}
  reason: Installed on Emscripten only (an httpx2 dependency), so the CI environment has no metadata for it.

# Native libraries a wheel bundles, found from the wheel's RECORD (a shared library that is not a Python extension
# module), keyed by the package that bundles it and then by the library's name without `lib`, version, hash and
# architecture. A record holds only for the package it sits under: another package shipping a file of that name has
# no record. A bundled library with no entry under its package is a missing record.
bundled_libraries:
  cffi:
    ffi:
      expression: MIT
      source: https://github.com/libffi/libffi/blob/master/LICENSE
      verified: {date: '2026-11-01', how: manual}
  numpy:
    scipy_openblas64:
      expression: BSD-3-Clause
      source: https://github.com/MacPython/openblas-libs/blob/main/LICENSE
      verified: {date: '2026-11-01', how: manual}
    scipy_openblas:
      expression: BSD-3-Clause
      source: https://github.com/MacPython/openblas-libs/blob/main/LICENSE
      verified: {date: '2026-11-01', how: manual}
    openblas:
      expression: BSD-3-Clause
      source: https://github.com/OpenMathLib/OpenBLAS/blob/develop/LICENSE
      verified: {date: '2026-11-01', how: manual}
    gfortran:
      expression: GPL-3.0-or-later WITH GCC-exception-3.1
      source: https://gcc.gnu.org/onlinedocs/libstdc++/manual/license.html
      verified: {date: '2026-11-01', how: manual}
    gcc_s:
      expression: GPL-3.0-or-later WITH GCC-exception-3.1
      source: https://gcc.gnu.org/onlinedocs/libstdc++/manual/license.html
      verified: {date: '2026-11-01', how: manual}
    quadmath:
      expression: LGPL-2.1-or-later
      source: https://gcc.gnu.org/onlinedocs/libquadmath/
      verified: {date: '2026-11-01', how: manual}
  soundfile:
    sndfile:
      expression: LGPL-2.1-or-later
      source: https://github.com/libsndfile/libsndfile/blob/master/COPYING
      verified: {date: '2026-11-01', how: manual}
