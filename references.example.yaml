# Placeholder names used in tracked text, with what each stands for.
# Copy to references.local.yaml (gitignored), fill in the values, and keep that file local.
# scripts/check_local_paths.py rejects the real values anywhere else in the tree.

SOFTWARE_ROOT:            # directory holding local checkouts of sibling repositories
AGENT_SCRATCH:            # scratch directory of a local agent session or job
LOCAL_INPUT:              # local folder holding input files and exported figures (Downloads)
XDG_DATA_HOME:            # per-user data directory (uv-managed interpreters live under it)
ORCD_GROUP_SCRATCH:       # group scratch directory on the ORCD cluster
ORCD_DATA:                # group data directory on the ORCD cluster
ORCD_PERSONAL_SCRATCH:    # personal scratch directory on the ORCD cluster
ORCD_SCRATCH_ROOT:        # top of the ORCD scratch filesystem
ORCD_DATA_ROOT:           # top of the ORCD data filesystem
CPU_PARTITION:            # personal Slurm partition used for CPU jobs
