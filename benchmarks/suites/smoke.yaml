format: benchmark-suite@1.0
name: smoke
benchmarks:
- {name: librispeech-asr, manifest: librispeech-test-clean, adapter: librispeech_asr, items: 10, task: speech_to_text, params: {timestamps: none}, metric: wer}
- {name: voxconverse-diarization, manifest: voxconverse-test-mirror, adapter: voxconverse_diarization, items: 2, max_seconds: 60, task: diarize, metric: der}
- {name: librispeech-speaker-trials, manifest: librispeech-test-clean, adapter: librispeech_trials, items: 20, task: speaker_embeddings, metric: eer}
- {name: gretel-pii, manifest: gretel-synthetic-pii, adapter: gretel_pii, items: 20, task: pii_spans, metric: span_f1}
- {name: synthetic-tones, adapter: synthetic_tones, items: 3, task: signal.resample, params: {target_rate: 16000}, metric: resample_error}
