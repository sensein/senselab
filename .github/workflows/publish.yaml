name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11']
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build every package
      run: uv build --all-packages
      shell: bash
    - name: Gate the release
      run: |
        RELEASE_FLOOR=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['senselab']['release']['RELEASE_FLOOR'])")
        uv run --no-project --with packaging python scripts/release_gate.py dist --floor "$RELEASE_FLOOR"
      shell: bash
    - name: Publish to PyPI
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
      run: uv publish dist/*
      shell: bash
