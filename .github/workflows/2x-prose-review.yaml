name: 2x Prose Review

permissions:
  pull-requests: write

on:
  pull_request:
    branches: [2.x, senselab-2x-api, 2x/**]
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: prose-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
    - name: Look for the model API key
      id: key
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        if [ -n "$ANTHROPIC_API_KEY" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Prose review skipped: the repository secret ANTHROPIC_API_KEY is not available."
        fi
    - uses: actions/checkout@v5
      if: steps.key.outputs.present == 'true'
    - name: Review the diff against the principles and engineering checklist
      if: steps.key.outputs.present == 'true'
      continue-on-error: true
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DIFF_FILE: ${{ runner.temp }}/pr.diff
        COMMENT_FILE: ${{ runner.temp }}/comment.md
        CHECKLIST_FILES: specs/20261030-140022-senselab-2x-api/principles.md:specs/20261030-140022-senselab-2x-api/engineering.md
      run: |
        gh pr diff "$PR_NUMBER" > "$DIFF_FILE" || true
        python3 .github/scripts/2x_prose_review.py
        gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE" --edit-last --create-if-none || true
