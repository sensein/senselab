name: Docs Preview

permissions:
  contents: write
  pull-requests: write
  deployments: write

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  build-and-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-branch
      cancel-in-progress: false
    environment:
      name: docs-preview
      url: https://sensein.group/senselab/pr-${{ github.event.pull_request.number }}/
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install FFmpeg
      run: bash scripts/install-ffmpeg.sh
    - name: Install dependencies
      run: uv sync --all-extras --group dev --group docs
    - name: Build docs
      env:
        PDOC_ALLOW_EXEC: '1'
      run: |
        APP_MODULE_NAME=$(ls -1 src | sort | head -1)
        uv run pdoc src/"$APP_MODULE_NAME" -o docs -t docs_style/pdoc-theme --docformat google --favicon https://readthedocs.org/favicon.ico
        uv run python scripts/generate-compat-matrix.py
        touch docs/.nojekyll
    - name: Deploy preview
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs
        branch: docs
        target-folder: pr-${{ github.event.pull_request.number }}
        clean: false
        single-commit: true

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-branch
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
      with:
        ref: docs
        fetch-depth: 1
    - name: Remove previews of every PR that is no longer open
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '.[].number')
        removed=0
        for dir in pr-*/; do
          [ -d "$dir" ] || continue
          num=${dir#pr-}
          num=${num%/}
          if ! grep -qx "$num" <<<"$open_prs"; then
            git rm -rq "$dir"
            removed=$((removed + 1))
          fi
        done
        echo "removed $removed preview(s)"
        [ "$removed" -eq 0 ] && exit 0
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -q --orphan docs-squashed
        git commit -qm "Docs site with previews of open PRs only"
        git push --force origin docs-squashed:docs
