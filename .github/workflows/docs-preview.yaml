name: Docs Preview

permissions:
  contents: write
  pull-requests: write
  deployments: write

on:
  # 1.x previews at the site root (pr-<N>/), for every base except the 2.x line, which runs
  # 2x-docs-preview.yaml.
  pull_request:
    branches-ignore: [2.x, senselab-2x-api, 2x/**]
    types: [opened, synchronize, reopened, closed]

jobs:
  build-and-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: docs-preview
      url: https://sensein.group/senselab/pr-${{ github.event.pull_request.number }}/
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install FFmpeg
      run: bash scripts/install-ffmpeg.sh
    - name: Install dependencies
      run: uv sync --all-extras --group dev --group docs
    - name: Build docs
      env:
        PDOC_ALLOW_EXEC: '1'
      run: |
        APP_MODULE_NAME=$(ls -1 src | sort | head -1)
        uv run pdoc src/"$APP_MODULE_NAME" -o docs -t docs_style/pdoc-theme --docformat google --favicon https://readthedocs.org/favicon.ico
        uv run python scripts/generate-compat-matrix.py
        touch docs/.nojekyll
    - name: Deploy preview
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bash .github/scripts/docs-deploy.sh preview docs "$PR_NUMBER"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v5
    - name: Remove previews of every PR that is no longer open
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '.[].number')
        # shellcheck disable=SC2086
        bash .github/scripts/docs-deploy.sh cleanup $open_prs
