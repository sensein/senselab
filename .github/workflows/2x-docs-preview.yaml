name: 2x Docs Preview

permissions:
  contents: write

on:
  # Previews of the 2.x line under 2x/pr-<N>/. 1.x PRs run docs-preview.yaml (root pr-<N>/).
  pull_request:
    branches: [2.x, senselab-2x-api, 2x/**]
    types: [opened, synchronize, reopened, closed]

jobs:
  build-and-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-preview-2x-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: docs-preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0   # hatch-vcs derives the package versions from tags
    - name: Look for the 2.x packages
      id: packages
      run: bash .github/scripts/check-2x-packages.sh
    - name: Install uv
      if: steps.packages.outputs.present == 'true'
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the 2.x packages and pdoc
      if: steps.packages.outputs.present == 'true'
      run: |
        uv venv -p 3.12 .docs
        uv pip install -p .docs ./packages/senselab-worker ./packages/senselab-core "pdoc~=16.0"
    - name: Build docs
      if: steps.packages.outputs.present == 'true'
      run: |
        .docs/bin/pdoc senselab_core senselab_worker -o docs -t docs_style/pdoc-theme --docformat google \
          --favicon https://readthedocs.org/favicon.ico
        touch docs/.nojekyll
    - name: Deploy preview
      id: deploy
      if: steps.packages.outputs.present == 'true'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        bash .github/scripts/docs-deploy.sh --namespace 2x preview docs "$PR_NUMBER"
        echo "url=https://sensein.group/senselab/2x/pr-$PR_NUMBER/" >> "$GITHUB_OUTPUT"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: docs-preview-2x-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v5
    - name: Remove 2.x previews of every PR that is no longer open
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '.[].number')
        # shellcheck disable=SC2086
        bash .github/scripts/docs-deploy.sh --namespace 2x cleanup $open_prs
