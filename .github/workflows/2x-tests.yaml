name: 2x-tests

on:
  # The 2.x line only. 1.x branches (alpha, main) run tests.yaml.
  push:
    branches: [2.x, senselab-2x-api, 2x/**]
  pull_request:
    branches: [2.x, senselab-2x-api, 2x/**]
    # `ready_for_review` matters because every job below is gated on `pull_request.draft == false`:
    # without it a draft PR marked ready never re-triggers this workflow.
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # Nightly: every job below, and the limits and use-case tiers. A schedule runs the default branch's copy of
  # this file, so it takes effect once the 2.x line is merged there.
  schedule:
  - cron: 17 3 * * *
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A missing package, or a package without its src/, fails this job and every job that needs it.
  detect:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Check the 2.x packages
      run: bash .github/scripts/check-2x-packages.sh

  pre-commit:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies with uv
      run: uv sync --locked --all-extras --group dev
    - name: Fetch the 1.x freeze branch
      run: bash .github/scripts/fetch-1x-freeze.sh
    - name: Run pre-commit
      run: uv run pre-commit run --all-files
      shell: bash

  core-only:
    needs: detect
    name: core-only (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the core distributions alone, from uv.lock
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
        UV_PROJECT_ENVIRONMENT: .core
      run: uv sync --locked --no-editable --python "$PYTHON_VERSION" --package senselab-core --group test
    - name: Run core tests
      run: .core/bin/pytest packages -m "logic or contract" -p no:cacheprovider
    - name: Check import contracts
      run: .core/bin/lint-imports
    - name: Build each sdist into a wheel on its own
      run: |
        for src in packages/senselab-worker packages/senselab-core .; do
          out=$(mktemp -d)
          uv build --sdist --out-dir "$out/dist" "$src"
          mkdir "$out/unpacked"
          tar -xzf "$out"/dist/*.tar.gz -C "$out/unpacked"
          uv build --wheel --out-dir "$out/wheel" "$out"/unpacked/*
        done

  # The limits tier on a PR carrying the `limits` label.
  core-limits:
    needs: detect
    name: core-limits
    if: contains(github.event.pull_request.labels.*.name, 'limits')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the core distributions alone, from uv.lock
      env:
        UV_PROJECT_ENVIRONMENT: .core
      run: uv sync --locked --no-editable --python 3.12 --package senselab-core --group test
    - name: Run the limits tier
      run: .core/bin/pytest packages -m limits -p no:cacheprovider

  # The limits and use-case tiers: nightly and on demand.
  core-nightly:
    needs: detect
    name: core-nightly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the core distributions alone, from uv.lock
      env:
        UV_PROJECT_ENVIRONMENT: .core
      run: uv sync --locked --no-editable --python 3.12 --package senselab-core --group test
    - name: Run the limits and use-case tiers
      run: .core/bin/pytest packages -m "limits or usecase" -p no:cacheprovider

  core-env:
    needs: detect
    name: core-env (release gate)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the core distributions alone, from uv.lock
      env:
        UV_PROJECT_ENVIRONMENT: .core
      run: uv sync --locked --no-editable --python 3.12 --package senselab-core --group test
    - name: Run the release gate tests, which build and create venvs
      run: .core/bin/pytest packages/senselab-core/tests/release_gate_test.py -m "env and not slow" -p no:cacheprovider

  worker-floor:
    needs: detect
    name: worker-floor (3.10)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Build the worker wheel
      run: uv build --wheel --out-dir dist packages/senselab-worker
    # The one job not installed from uv.lock: the lock's requires-python is >=3.11, so it cannot resolve for 3.10,
    # and the job pins numpy to the worker's floor on purpose. ci_tiers_test names it as the only exception.
    - name: Install the wheel alone at the floor
      run: |
        uv venv -p 3.10 .floor
        uv pip install --python .floor dist/senselab_worker-*.whl numpy==1.23.5 pytest pytest-timeout hypothesis
    - name: Run worker tests
      run: .floor/bin/pytest packages/senselab-worker/tests -m "logic or env or contract" -p no:cacheprovider
