name: 2x-tests

on:
  # The 2.x line only. Python 3.13 (scripts/data/default_python.yaml) on every run; the full matrix runs nightly and on
  # PRs labelled full-matrix. 1.x branches (alpha, main) run tests.yaml.
  push:
    branches: [2.x, senselab-2x-api, 2x/**]
  pull_request:
    branches: [2.x, senselab-2x-api, 2x/**]
    # `ready_for_review` re-triggers a draft PR marked ready; `edited` re-checks the models named in the body.
    types: [opened, synchronize, reopened, labeled, ready_for_review, edited]
  workflow_dispatch:
  # The nightly workflow on the default branch (2x-nightly.yaml) calls this file at 2.x with `ref: 2.x`.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # A missing package, or a package without its src/, fails this job and every job that needs it.
  detect:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 1
    - name: Check the 2.x packages
      run: bash .github/scripts/check-2x-packages.sh

  pre-commit:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 1
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install dependencies with uv
      run: uv sync --locked --all-extras --group dev
    - name: Fetch the 1.x freeze branch
      run: bash .github/scripts/fetch-1x-freeze.sh
    - name: Run pre-commit
      run: uv run pre-commit run --all-files
      shell: bash

  core-only:
    needs: detect
    name: core-only (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ (inputs.ref != '' || contains(github.event.pull_request.labels.*.name, 'full-matrix')) && fromJSON('["3.11","3.12","3.13","3.14"]') || fromJSON('["3.13"]') }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the core distributions alone, from uv.lock
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
        UV_PROJECT_ENVIRONMENT: .core
      run: uv sync --locked --no-editable --python "$PYTHON_VERSION" --package senselab-core --group test
    # The keeper's hidden-/proc test runs in an unprivileged user and mount namespace, which Ubuntu's AppArmor
    # restricts by default; SENSELAB_REQUIRE_NAMESPACES=1 makes that test fail rather than skip.
    - name: Allow unprivileged user namespaces
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Run core tests
      env:
        SENSELAB_REQUIRE_NAMESPACES: '1'
      run: .core/bin/pytest packages/senselab-core packages/senselab-worker -m "(logic or contract) and not model" -p no:cacheprovider --timeout=300 -rs
    - name: Build each sdist into a wheel on its own
      run: |
        for src in packages/senselab-worker packages/senselab-core .; do
          out=$(mktemp -d)
          uv build --sdist --out-dir "$out/dist" "$src"
          mkdir "$out/unpacked"
          tar -xzf "$out"/dist/*.tar.gz -C "$out/unpacked"
          uv build --wheel --out-dir "$out/wheel" "$out"/unpacked/*
        done

  # The core distributions with the pydra extra, from uv.lock: the plan runner's tests, which core-only skips.
  core-pydra:
    needs: detect
    name: core-pydra (3.13)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the core distributions with the pydra extra, from uv.lock
      env:
        UV_PROJECT_ENVIRONMENT: .core-pydra
      run: uv sync --locked --no-editable --python 3.13 --package senselab-core --extra pydra --group test
    - name: Run the execution tests with pydra
      run: .core-pydra/bin/pytest packages/senselab-core/tests/runtime/execution packages/senselab-core/tests/kernel packages/senselab-core/tests/lint -m "(logic or contract) and not model" -p no:cacheprovider --timeout=300

  # The root distribution without extras, from uv.lock: the 2.x package imports and runs with no model framework.
  senselab-lean:
    needs: detect
    name: senselab-lean (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ (inputs.ref != '' || contains(github.event.pull_request.labels.*.name, 'full-matrix')) && fromJSON('["3.11","3.12","3.13","3.14"]') || fromJSON('["3.13"]') }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the root distribution without extras, from uv.lock
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
        UV_PROJECT_ENVIRONMENT: .lean
      run: uv sync --locked --no-editable --python "$PYTHON_VERSION" --package senselab --no-default-groups --group test
    - name: Run the senselab tests
      run: .lean/bin/pytest packages/senselab/tests -m "(logic or contract) and not model" -p no:cacheprovider
    - name: Check import contracts
      run: .lean/bin/lint-imports

  # The model-free limits tier on a PR carrying the `limits` label; limits that load a model run on ORCD.
  # On a PR carrying the `limits` label, and on a push to a `2x/` branch that changes the probe's fit.
  core-limits:
    needs: detect
    name: core-limits
    if: contains(github.event.pull_request.labels.*.name, 'limits') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/2x/'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Whether this run tests the limits tier
      id: scope
      env:
        BEFORE: ${{ github.event.before }}
        PATHS: >-
          packages/senselab-core/src/senselab_core/runtime/probe.py
          packages/senselab-core/src/senselab_core/runtime/calibration.py
      # A base the clone lacks (a new branch, a force push) counts as a change.
      run: |
        if [ "$GITHUB_EVENT_NAME" = push ] && git diff --quiet "$BEFORE" HEAD -- $PATHS; then
          echo run=false >> "$GITHUB_OUTPUT"
        else
          echo run=true >> "$GITHUB_OUTPUT"
        fi
    - name: Install uv
      if: steps.scope.outputs.run == 'true'
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the core distributions alone, from uv.lock
      if: steps.scope.outputs.run == 'true'
      env:
        UV_PROJECT_ENVIRONMENT: .core
      run: uv sync --locked --no-editable --python 3.13 --package senselab-core --group test
    - name: Run the limits tier
      if: steps.scope.outputs.run == 'true'
      run: .core/bin/pytest packages -m "limits and not model" -p no:cacheprovider

  # The declared version of a task or backend moves whenever its source does (scripts/check_source_digests.py).
  source-digests:
    needs: detect
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0   # the merge-base with 2.x
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the core distributions alone, from uv.lock
      env:
        UV_PROJECT_ENVIRONMENT: .core
      run: uv sync --locked --no-editable --python 3.13 --package senselab-core --group test
    - name: Check the source digests
      run: .core/bin/python scripts/check_source_digests.py

  # The PR names an implementer model and a different reviewer model (P-40).
  pr-models:
    needs: detect
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Check the models in the PR body
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: uv run --no-project --python 3.13 python scripts/check_pr_models.py

  core-env:
    needs: detect
    name: core-env (release gate)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the core distributions alone, from uv.lock
      env:
        UV_PROJECT_ENVIRONMENT: .core
      run: uv sync --locked --no-editable --python 3.13 --package senselab-core --group test
    - name: Run the release gate tests, which build and create venvs
      run: .core/bin/pytest packages/senselab-core/tests/release_gate_test.py -m "env and not slow and not model" -p no:cacheprovider

  # Every locked runtime dependency of the three distributions has a license its distribution's policy allows
  # (scripts/data/license_policy.yaml), and so has every native library a wheel bundles.
  licenses:
    needs: detect
    name: licenses
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Install the root distribution and its dependencies, from uv.lock
      env:
        UV_PROJECT_ENVIRONMENT: .licenses
      run: uv sync --locked --no-editable --python 3.13 --package senselab --no-default-groups
    - name: Check the licenses
      run: .licenses/bin/python scripts/check_licenses.py --json licenses.json
    - name: Keep the license table
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: licenses
        path: licenses.json
        if-no-files-found: ignore

  worker-floor:
    needs: detect
    name: worker-floor (3.10)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0   # hatch-vcs derives the version from tags
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.13.6
    - name: Build the worker wheel
      run: uv build --wheel --out-dir dist packages/senselab-worker
    # The lock's requires-python is >=3.11, so uv.lock cannot serve 3.10. This job installs from its own lock,
    # .github/locks/worker-floor.txt (numpy 1.23.5 and the worker's test dependencies, hashed), then the wheel
    # built above with no dependency resolution.
    - name: Install the lock, then the wheel, at the floor
      run: |
        uv venv -p 3.10 .floor
        uv pip sync --python .floor --require-hashes .github/locks/worker-floor.txt
        uv pip install --python .floor --no-deps dist/senselab_worker-*.whl
    - name: Run worker tests
      run: .floor/bin/pytest packages/senselab-worker/tests -m "(logic or env or contract) and not model" -p no:cacheprovider
