[build-system]
requires = ["hatchling==1.33.0", "hatch-vcs==0.5.0", "setuptools-scm==10.3.4", "vcs-versioning==2.6.0", "packaging==26.3"]
build-backend = "hatchling.build"

[project]
name = "senselab"
dynamic = ["version", "dependencies"]
description = "senselab 2.x: the public package and CLI over the framework-free core and the subprocess worker runtime."
authors = [
  { name = "Fabio Catania", email = "fabiocat@mit.edu" },
  { name = "Satra Ghosh", email = "satra@mit.edu" }
]
maintainers = [
  { name = "Fabio Catania", email = "fabiocat@mit.edu" },
  { name = "Satra Ghosh", email = "satra@mit.edu" },
  { name = "Jordan Wilke", email = "wilke18@mit.edu" }
]
license = { file = "LICENSE.md" }
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["audio", "voice", "speech", "provenance", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/sensein/senselab"
Repository = "https://github.com/sensein/senselab"
Documentation = "https://sensein.group/senselab"

[project.optional-dependencies]
torch = ["torch>=2.4", "transformers>=5.8"]

[project.scripts]
senselab = "senselab.cli:main"

[dependency-groups]
dev = [
  "pytest-xdist[psutil]~=3.8.0",
  "pytest-mock~=3.14",
  "pytest-cov~=7.0",
  "pytest-timeout~=2.4",
  "mypy~=1.9",
  "pre-commit~=4.0",
  "ruff==0.15.11",
  "codespell~=2.3",
  "uvloop~=0.22",
  "types-requests~=2.32",
  "types-pyyaml~=6.0",
  "python-dotenv~=1.1",
  "ipython~=9.7",
  "ipykernel~=7.1",
  "ipywidgets~=8.1",
  "jupyterlab~=4.4",
  "papermill~=2.6",
  "import-linter~=2.0",
  "hypothesis~=6.0"
]
test = [
  "pytest",
  "pytest-timeout~=2.4",
  "import-linter~=2.0",
  "grimp",
  "jsonschema",
  "hypothesis",
  "scipy>=1.11"
]
docs = [
  "pdoc~=16.0"
]
profiling = [
  "scalene>=2.2",
  "nbconvert>=7"
]
benchmarks = [
  "pyarrow>=18"
]

[tool.uv.workspace]
members = ["packages/senselab-*"]

[tool.uv.sources]
senselab-core = { workspace = true }
senselab-worker = { workspace = true }

[tool.hatch.metadata.hooks.custom]
path = "hatch_build_pins.py"
pins = ["senselab-core", "senselab-worker"]
dependencies = []

[tool.senselab.release]
RELEASE_FLOOR = "2.0.0a0"

[tool.hatch.build.targets.wheel]
packages = ["packages/senselab/src/senselab"]
dev-mode-dirs = ["packages/senselab/src"]

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "hatch_build_pins.py", "packages/senselab/src", "README.md", "LICENSE.md", "SECURITY.md", "uv.lock"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
git_describe_command = "git describe --dirty --tags --long --match '[0-9]*.[0-9]*.[0-9]*'"

[tool.pytest.ini_options]
testpaths = [
  "packages"
]
addopts = "--strict-markers -p pytester -m logic"
markers = [
  "logic: pure logic, no I/O beyond tmp files",
  "contract: a boundary contract between components",
  "limits: behaviour at declared limits",
  "usecase: an end-to-end use case",
  "env: needs a built environment",
  "model: loads weights or needs a backend env",
  "gpu: needs a GPU",
  "network: needs network outside the sandbox",
  "slow: long-running",
  "large_model: loads a large model"
]
timeout = 900

[tool.mypy]
ignore_missing_imports = true
plugins = [
  "pydantic.mypy"
]
extra_checks = true
exclude = ["^src/"]

[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  # The 1.x source pool, frozen and not checked on the 2.x line.
  "./src",
  # The 1.x scripts under scripts/, not checked on the 2.x line. The 2.x scripts are release_gate,
  # check_fixture_budget, check_licenses, check_participant_ids, check_size_budgets, check_spec_ids,
  # lock_envs and profile_*.
  "scripts/adaptive_loop.py",
  "scripts/analyze_audio.py",
  "scripts/analyze_routing_evidence.py",
  "scripts/bench_facial_analysis.py",
  "scripts/benchmark_*.py",
  "scripts/build_classifier_ontology_map.py",
  "scripts/calibrate_*.py",
  "scripts/check_layering.py",
  "scripts/evaluate_task_events.py",
  "scripts/extend_*.py",
  "scripts/free_speech_review_page.py",
  "scripts/gate_family_matrix.py",
  "scripts/generate-compat-matrix.py",
  "scripts/generate_model_registry.py",
  "scripts/make_degradation_suite.py",
  "scripts/measure_session_background.py",
  "scripts/probe_*.py",
  "scripts/run_diarization_backends.py",
  "scripts/score_taxonomy_ruleset.py",
  "scripts/select_replay_manifest.py",
  "scripts/speaker_ceiling",
  "scripts/triage_*.py",
  "scripts/verify_*.py",
  # One-off reproduction scripts for the analyze_audio audit's findings, kept beside the register
  # entry each reproduces. They are evidence, not source: each is meant to read as the code under
  # audit reads, and re-styling one would change what it demonstrates.
  "specs/20260815-215106-analyze-audio-audit/repro"
]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["ANN", "D", "E", "F", "I", "B009", "S102", "S307"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B009", "S102", "S307"]
"**/conftest.py" = ["B009", "S102", "S307"]
"**/scripts/**" = ["ANN", "D", "E", "I", "F541"]
# Notebooks: cells share state but ruff lints per-cell, causing false positives
"tutorials/**/*.ipynb" = ["F401", "F821", "E402", "I001", "F811", "ANN001", "ANN201", "D103"]

[tool.ruff.format]
exclude = ["scripts/**"]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.codespell]
skip = [
  "uv.lock",
  "docs_style/pdoc-theme/syntax-highlighting.css",
  "./src",
  "*.cha",
  "*.ipynb"
]
ignore-words-list = ["senselab", "nd", "astroid", "wil", "SER", "te", "EXPRESSO", "VAI", "vie", "g2p", "pres", "befores", "trough", "bellow", "coo", "patter", "AER", "preemptable"]

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
