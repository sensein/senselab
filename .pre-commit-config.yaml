fail_fast: false

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.5
  hooks:
  # Spec trees hold design notes plus the one-off scripts that reproduce a finding. Those scripts are
  # evidence -- several deliberately contain the defective pattern they demonstrate -- so linting
  # them to library standards asks them to stop being reproductions, and formatting them edits the
  # record of what was measured. Excluded here rather than in pyproject's ruff config, because
  # pyproject describes the package and `specs/` is not part of it (it is not in the wheel, and as
  # of this change not in the sdist either). The mypy hook below excludes the same trees.
  - id: ruff
    exclude: ^specs/
  - id: ruff-format
    exclude: ^specs/

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.18.2
  hooks:
  - id: mypy
    args: [--ignore-missing-imports, --extra-checks]
    exclude: ^(scripts|specs)/
    additional_dependencies:
    - pydantic>=1.10.4
    - types-requests
    # `run_config.py` reads the packaged YAML, and this hook's mypy runs in an isolated env —
    # so the stubs the dev group provides are not visible to it. Without this the hook fails
    # with `Library stubs not installed for "yaml"` while a local `uv run mypy .` passes.
    - types-PyYAML
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.15.0
  hooks:
  # The cohort-condition profiles hold regular expressions; the formatter strips their quotes, and an
  # unquoted `\btremors?\b` inside a flow list is not valid YAML, so it would break the file it formats.
  - id: pretty-format-yaml
    # task_guidance.yaml is hashed by bytes into the reviewer and second-opinion cache identity
    exclude: ^(src/senselab/audio/workflows/triage/data/cohort_conditions/|src/senselab/text/tasks/pii_detection/data/task_guidance\.yaml$)
    args:
    - --autofix
    - --indent=2
  - id: pretty-format-toml
    exclude: ^uv.lock$
    args:
    - --autofix
    - --indent=2
    - --no-sort

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args: [--maxkb=15000]
  - id: check-case-conflict
  # The b2aiprep task registry is vendored verbatim from upstream (data/b2ai_task_registry/PROVENANCE.yaml:
  # "never hand-edit them"), so the formatters and codespell leave it byte-identical to its source commit.
  - id: end-of-file-fixer
    exclude: ^(specs/.*/raw/|src/senselab/audio/workflows/triage/data/b2ai_task_registry/)
  - id: trailing-whitespace
    exclude: ^(specs/.*/raw/|src/senselab/audio/workflows/triage/review_page/vendor/)
  - id: pretty-format-json
    exclude: ^(specs/.*/raw/|src/senselab/audio/workflows/triage/data/b2ai_task_registry/)
    args:
    - --autofix
    - --indent=4
    - --no-sort-keys
  - id: check-merge-conflict
  - id: check-yaml
  - id: check-json
  - id: check-toml
  - id: detect-private-key
  - id: name-tests-test

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
  - id: codespell
    # AER: alignment error rate. FPR: false-positive rate. PASE: Problem-Agnostic Speech
    # Encoder, a model name. preemptable: Slurm's own spelling (PreemptMode, the
    # mit_preemptable partition) -- codespell wants "preemptible", but that is not the
    # partition's actual name. caf: Apple Core Audio Format. als: MPEG-4 ALS, both file
    # extensions in the I/O format matrix. Each is a term codespell reads as a misspelling of
    # another word. Raw captured output is excluded rather than corrected: it is a verbatim
    # record, and a truncated word in a printed table is part of what was printed.
    exclude: ^(specs/.*/raw/|src/senselab/audio/workflows/triage/review_page/vendor/)
    # The second group are this workflow's own vocabulary and its verbatim records:
    # UNDET/UNDETERMINED and NotIn are value names; FigureStyle is a class; allk, empt and
    # empted are fragments of identifiers codespell splits; disjointness, declaring, meaned,
    # retuned and unparseable are ordinary words it reads as misspellings; probablistic appears
    # only inside a quoted instruction, where correcting it would misquote the speaker.
    # The vendored parquet reader and the page that inlines it are minified JavaScript, whose
    # short identifiers codespell reads as misspelt words. Skipped whole, as the pdoc theme's
    # generated CSS already is; the parts they are built from are checked normally. The vendored
    # b2aiprep registry is upstream data (Spanish stimuli among it) and is skipped for the same
    # reason. oclock is temporal_words.yaml's normalised key for "o'clock"; meu is Portuguese,
    # quoted from a transcript in a spec. mis, ser, vas, hace and varios are Spanish words in the
    # redaction policy's Spanish lexicons.
    args: [--skip=*.ipynb, --skip=src/senselab/audio/workflows/triage/viewer/vendor/*.js, --skip=src/senselab/audio/workflows/triage/viewer/recording_vectors_viewer.html, --skip=src/senselab/audio/workflows/triage/data/b2ai_task_registry/*, --ignore-words-list, 'oclock,meu,AER,FPR,PASE,preemptable,caf,als,UNDET,UNX,NotIn,FigureStyle,allk,empt,empted,disjointness,declaring,meaned,retuned,re-declaring,pre-empt,pre-empted,unparseable,probablistic,mis,ser,vas,hace,varios']
    additional_dependencies:
    - tomli
- repo: local
  hooks:
  - id: yaml-file-extension
    name: Prefer .yaml over .yml.
    entry: YAML files must have .yaml extension.
    language: fail
    files: \.yml$
