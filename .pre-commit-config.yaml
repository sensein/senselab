fail_fast: false

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.5
  hooks:
  - id: ruff
  - id: ruff-format

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.18.2
  hooks:
  - id: mypy
    args: [--ignore-missing-imports, --extra-checks]
    exclude: ^(scripts|specs)/
    additional_dependencies:
    - pydantic>=1.10.4
    - types-requests
    # `run_config.py` reads the packaged YAML, and this hook's mypy runs in an isolated env —
    # so the stubs the dev group provides are not visible to it. Without this the hook fails
    # with `Library stubs not installed for "yaml"` while a local `uv run mypy .` passes.
    - types-PyYAML
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.15.0
  hooks:
  - id: pretty-format-yaml
    args:
    - --autofix
    - --indent=2
  - id: pretty-format-toml
    exclude: ^uv.lock$
    args:
    - --autofix
    - --indent=2
    - --no-sort

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args: [--maxkb=15000]
  - id: check-case-conflict
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: pretty-format-json
    args:
    - --autofix
    - --indent=4
    - --no-sort-keys
  - id: check-merge-conflict
  - id: check-yaml
  - id: check-json
  - id: check-toml
  - id: detect-private-key
  - id: name-tests-test

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
  - id: codespell
    # AER: alignment error rate. FPR: false-positive rate. PASE: Problem-Agnostic Speech
    # Encoder, a model name. preemptable: Slurm's own spelling (PreemptMode, the
    # mit_preemptable partition) -- codespell wants "preemptible", but that is not the
    # partition's actual name. All four are terms codespell reads as misspellings of other
    # words.
    args: [--skip=*.ipynb, --ignore-words-list, 'AER,FPR,PASE,preemptable']
    additional_dependencies:
    - tomli
- repo: local
  hooks:
  - id: yaml-file-extension
    name: Prefer .yaml over .yml.
    entry: YAML files must have .yaml extension.
    language: fail
    files: \.yml$
