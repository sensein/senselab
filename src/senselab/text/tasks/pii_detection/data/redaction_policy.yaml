# A spelled year: a century word followed by more number words ("nineteen ninety-eight", "twenty
# twenty-one"), or "two thousand" / "dos mil" / "mil novecientos" and what follows.
year_centuries: [seventeen, eighteen, nineteen]
year_twenty_followers: [ten, eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty]
year_thousand_heads: [[two, thousand], [dos, mil], [mil, novecientos], [mil, ochocientos]]
# A bare "two thousand" is a year only after one of these ("in two thousand"), not "two thousand steps".
year_lead: [in, since, until, from, by, around, before, after, en, desde, hasta, antes, despues]
