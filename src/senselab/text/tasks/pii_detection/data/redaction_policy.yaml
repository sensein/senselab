# Words that make a number beside them an age.
age_after: [old, olds, yo]
age_units: [year, years, yr, yrs, ano, anos]
age_before: [age, aged, edad, turned, turning, cumpli, cumplo, cumple, tengo]
age_decades: [teens, twenties, thirties, forties, fifties, sixties, seventies, eighties, nineties, 20s, 30s, 40s, 50s, 60s, 70s, 80s, 90s, veinte, treinta, cuarenta, cincuenta, sesenta, setenta, ochenta, noventa]
