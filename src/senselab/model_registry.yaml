- name: DriftSE
  task: speech_enhancement
  source: LiangXu123 (unpackaged upstream repo, via subprocess venv)
  model_id: LIANGXU123/DriftSE
  parameters: N/A
  training_data: VoiceBank-DEMAND (per the released configs); DNS 2020 blind test set for the paper's generalization numbers. This backend is inference-only and verifies no training config.
  license: >-
    MIT. Upstream added a LICENSE file on 2026-08-13 (commit 9ecfbac6) in response to
    https://github.com/LiangXu123/DriftSE/issues/2, now closed, and its own weights mirror
    https://huggingface.co/LIANGXU123/DriftSE carries license: mit. Two checkpoints are published:
    distillhubert_three_layers_with_z (default) and
    distillhubert_three_layers_pesq_sisdr_ccmse_with_z. SENSELAB_DRIFTSE_CHECKPOINT remains for a
    caller supplying their own weights. The advertised PESQ/SI-SDR figures rest on a VoiceBank-DEMAND
    test-set copy an independent reproducer could not reproduce (issue #1, open); read them as
    advertised rather than confirmed.
  recommended_for: >-
    One-step (1 NFE) generative enhancement, CPU-viable; selectable by naming this model id, not the
    default enhancer and not in any default model list (via subprocess venv, pinned upstream commit
    0a489dadfa2778e86e4b4b0af03f6255d2de8c69, weights pinned at
    b99a25a637a9963d5c7557f0b70597fc54c7a0bb). See
    specs/20260818-083214-driftse-upstream-mit/design.md.

- name: ClearVoice FRCRN (16kHz)
  task: speech_enhancement
  source: alibabasglab (clearvoice==0.1.2, via subprocess venv, Python 3.11)
  model_id: alibabasglab/FRCRN_SE_16K
  parameters: ~40M (161 MB checkpoint)
  training_data: >-
    DNS-Challenge and VoiceBank-DEMAND scale corpora per upstream; this backend is inference-only
    and verifies no training config.
  license: >-
    Apache-2.0, on both the upstream repository and each weights repository's model card. senselab
    pins by pre-staging the checkpoint at a resolved commit and pointing the loader at that local
    path, because clearvoice's own SpeechModel.download_model calls snapshot_download with no
    revision argument; see specs/20260819-clearvoice-integration/design.md D-6.
  recommended_for: >-
    Enhancement at 16kHz that keeps non-speech events. Measured against six human-verified events:
    breaths survive at -2.0 and -5.5 dB and coughs at -1.0 and +0.1 dB, so it is the checkpoint to
    choose when breaths or coughs are signal rather than noise. Energy-conserving.

- name: ClearVoice MossFormerGAN (16kHz)
  task: speech_enhancement
  source: alibabasglab (clearvoice==0.1.2, via subprocess venv, Python 3.11)
  model_id: alibabasglab/MossFormerGAN_SE_16K
  parameters: ~10M generator + ~24M discriminator (39 MB + 98 MB checkpoints)
  training_data: >-
    As above; upstream reports the best PESQ of the three on VoiceBank-DEMAND and DNS-2020.
  license: >-
    Apache-2.0, on both the upstream repository and each weights repository's model card. senselab
    pins by pre-staging the checkpoint at a resolved commit and pointing the loader at that local
    path, because clearvoice's own SpeechModel.download_model calls snapshot_download with no
    revision argument; see specs/20260819-clearvoice-integration/design.md D-6.
  recommended_for: >-
    Speech alone, aggressively. Highest PESQ of the three upstream, but measured to discard about
    92% of input energy: breaths at -51 dB and two of four verified coughs removed entirely.
    Destructive for any analysis that treats non-speech sound as signal.

- name: ClearVoice MossFormer2 (48kHz)
  task: speech_enhancement
  source: alibabasglab (clearvoice==0.1.2, via subprocess venv, Python 3.11)
  model_id: alibabasglab/MossFormer2_SE_48K
  parameters: ~55M (222 MB checkpoint)
  training_data: >-
    As above, at 48 kHz; upstream compares it against Resemble-Enhance and DeepFilterNet.
  license: >-
    Apache-2.0, on both the upstream repository and each weights repository's model card. senselab
    pins by pre-staging the checkpoint at a resolved commit and pointing the loader at that local
    path, because clearvoice's own SpeechModel.download_model calls snapshot_download with no
    revision argument; see specs/20260819-clearvoice-integration/design.md D-6.
  recommended_for: >-
    Fullband (48kHz) enhancement. Measured to destroy breaths (-37 and -40 dB on two verified
    exhalations) while keeping coughs (-0.6, +0.2 dB), so the choice between this and FRCRN decides
    which non-speech element survives. Energy-conserving.

# Health Acoustics
- name: HeAR (encoder)
  task: health_acoustics
  source: google (TensorFlow SavedModel, via subprocess venv)
  model_id: google/hear
  embedding_dim: 512
  parameters: ~300M (ViT-L MAE)
  training_data: 313M two-second clips of non-semantic human sounds (YouTube-scale, unlabelled)
  license: >-
    Other -- Health AI Developer Foundations terms of use
    (https://developers.google.com/health-ai-developer-foundations/terms). Gated on Hugging Face;
    access is granted immediately on acknowledging the terms while logged in. Pinned at commit
    9b2eb2853c426676255cc6ac5804b7f1fe8e563f.
  recommended_for: >-
    Health-acoustic representations of coughs, breaths, throat clears and similar non-semantic
    sounds, on a fixed 2s window. Not speaker identity. Similarity between embeddings must be
    mean-centred (raw cosine measures 0.977 within-class against 0.918 between; centred, +0.653
    against -0.256). See src/senselab/audio/tasks/health_acoustics/doc.md.
- name: HeAR event detector (large)
  task: health_acoustics
  source: google (TensorFlow SavedModel, via subprocess venv)
  model_id: google/hear (event_detector/event_detector_large)
  parameters: ~3M (MobileNetV3-Large)
  training_data: Health sound events; 8 labels (Cough, Snore, Baby Cough, Breathe, Sneeze, Throat Clear, Laugh, Speech)
  license: >-
    Same repository, same gated Health AI Developer Foundations terms and same pinned commit as
    the HeAR encoder above.
  recommended_for: >-
    Presence gating and dataset filtering for health sounds on a fixed 2s window. A presence gate,
    not a locator: 40ms of cough crosses p > 0.5, so the response is a box-car of width (event +
    2s) and events closer than 2s merge.
- name: HeAR event detector (small)
  task: health_acoustics
  source: google (TensorFlow SavedModel, via subprocess venv)
  model_id: google/hear (event_detector/event_detector_small)
  parameters: ~1M (MobileNetV3-Small)
  training_data: Same 8 labels and the same shared spectrogram frontend as the large detector
  license: >-
    Same repository, same gated Health AI Developer Foundations terms and same pinned commit as
    the HeAR encoder above.
  recommended_for: >-
    The same presence gating on resource-constrained hosts; upstream reports it as the compact
    alternative, at ~1M parameters against ~3M.

# Source Separation
- name: unasdiff
  task: separation
  source: RunwuShi (unpackaged upstream repo, via subprocess venv, Python 3.10, torch==2.6.0)
  model_id: sensein/unasdiff-diffusion-priors
  parameters: N/A
  training_data: >-
    Speech prior: VCTK. Sound prior: FSD50K subset (41 of 50 conditioning
    slots trained; per paper, this backend is inference-only and does not
    verify a training config)
  license: >-
    Unknown — unresolved upstream. The source repository
    https://github.com/RunwuShi/unasdiff carries no LICENSE file and no
    README licence statement, so no terms have been granted for these
    weights. A licence request was opened 2026-08-08 and is unanswered:
    https://github.com/RunwuShi/unasdiff/issues/1. The mirror is public so
    the backend is usable during the alpha, which is a deliberate decision
    taken with that unknown status visible rather than resolved:
    reachability grants no rights. Treat the weights as
    all-rights-reserved by default, and consult upstream before any use
    that depends on licence terms. SENSELAB_UNASDIFF_CHECKPOINTS remains
    for a caller supplying their own checkpoints.
  recommended_for: >-
    Unsupervised speech/sound source separation via two independently
    trained diffusion priors (speech_sound, sound_sound, speech_speech
    modes); reachable only via an explicit HFModel id, not in any default
    model list and not wired into audio_analysis (via subprocess venv,
    pinned upstream commit 5a5d70cdc94fe9d034892a1c5bc68ad1a67d2daa)

- name: ClearVoice MossFormer2 (separation, 16kHz)
  task: separation
  source: alibabasglab (clearvoice==0.1.2, via subprocess venv, Python 3.11)
  model_id: alibabasglab/MossFormer2_SS_16K
  parameters: ~170M (670 MB checkpoint)
  training_data: >-
    LRS2-2Mix, WSJ0-2Mix, Libri2Mix and WHAM! per upstream's unified model; inference-only here.
  license: >-
    Apache-2.0, on both the upstream repository and each weights repository's model card. senselab
    pins by pre-staging the checkpoint at a resolved commit and pointing the loader at that local
    path, because clearvoice's own SpeechModel.download_model calls snapshot_download with no
    revision argument; see specs/20260819-clearvoice-integration/design.md D-6.
  recommended_for: >-
    Two-speaker separation at 16kHz; upstream's SI-SNRi leads SepFormer on LRS2-2Mix (15.5 vs 13.5).
    Not a class decomposer: measured to assign each cough burst to whichever of its two slots is
    free rather than isolating cough as a class. Its two sources come back RMS-matched to a
    -25 dBFS normalised input rather than to the caller's level, which each returned Audio reports.

