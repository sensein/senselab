  model_id: alibabasglab/AV_MossFormer2_TSE_16K
  parameters: ~180M (735 MB checkpoint) plus an 86 MB S3FD face detector
  training_data: >-
    LRS2/VoxCeleb2 lip-conditioned recipes per upstream's train/target_speaker_extraction;
    inference-only here.
  license: >-
    Apache-2.0, as above. Two weights, pinned two different ways: the checkpoint by resolved commit
    (design.md D-6), and the S3FD face detector by sha256
    d54a87c2b7543b64729c9a25eafd188da15fd3f6e02f0ecec76ae1b30d86c491 at commit
    6b3774dc79c46ae8bed2a4fa5f706f0ac8c75c61, because it ships in no wheel and upstream fetches it
    from an unversioned Google Drive id (design.md D-7).
  recommended_for: >-
    Extracting each visible speaker's voice from a video using their lip motion, one output per
    detected face track. Requires a video file, not decoded frames, and ffmpeg on PATH. Not
    verified numerically in this repository -- see design.md D-3 and the task's doc.md.

