# The recording-level background model QUALITY reads off every recording (background_model.py).
# Task-independent: a per-band stationary floor estimated outside the active regions, mains hum on
# the residual, impulses, regions of activity, and the acquisition faults. The derivation of every
# value is in specs/20261007-task-events-in-background/design.md ("Unit A: the generic layer");
# values marked UNFITTED are to be fitted jointly on the owner's labels.
version: 2
phonation_db: 10.0                # the shutoff needs a frame this far over that floor before it
floor:
  pad_s: 0.1                      # active frames are widened by this before the floor is re-read
  quiet_min_s: 0.5                # less quiet time than this and the recording's own floor is unobservable
  residual_gap_db: 25.0           # own floor this far over the residual's (median over bands): the task fills the file. Not read for a kind session_background.yaml decides for
activity:
  margin_db: 6.0                  # UNFITTED (C2 m): a band is active this far over its floor. TO REFIT against the session background with task_events.yaml decision
  band_fraction: 0.3              # UNFITTED (C2 q): share of bands active for the frame to be active
  bridge_s: 0.1                   # gaps an active region is joined across
  min_s: 0.1                      # shortest active region
impulse:
  peak_db: 15.0                   # an envelope peak this far over its background is a candidate
  onset_db: 3.0                   # the candidate starts and ends where it falls back within this
  attack_max_ms: 5.0              # UNFITTED (C1): an impulse rises this fast
  duration_max_ms: 80.0           # UNFITTED (C1): and is over this soon; a quick breath (about 0.25 s) is not
hum:
  line_db: 10.0                   # line over its neighbourhood that counts, as voice_phonation.yaml
  neighbourhood_hz: [2.0, 8.0]    # offsets either side the neighbourhood is read over
  lines_min: 3                    # lines that fire (31/36 hum, 0/30 clean, 2026-10-06)
shutoff:                          # as voice_phonation.yaml, now read on every recording
  below_floor_db: 8.0
  drop_db: 30.0
  drop_s: 0.1
  flat_db: 1.0
  bridge_s: 0.15
  min_s: 0.3
disruptions:                      # dropout and discontinuity extents on the original recording
  merge_s: 0.01                   # discontinuities this close are one span
session:                          # the BIDS session floor (specs/.../design.md, "Unit C step 1")
  members_min: 3                  # UNFITTED: fewer usable members and the recording keeps its own floor
  gap_db: 25.0                    # UNFITTED: own floor this far over the session's (median over bands) takes the session's; as floor.residual_gap_db. Not read for a kind session_background.yaml decides for
