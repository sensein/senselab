# Which words of a DATE_TIME-family finding the fold releases by kind: a time of day, a weekday, a
# season, a relative reference or a length of time, none of which is an absolute date element. Compared after
# the redaction policy's own folding (lower case, accents and apostrophes dropped) with dots and
# hyphens dropped too ("o'clock" -> "oclock", "a.m." -> "am", "2-3" -> "23").
#
# derivation: owner, 2026-10-02, on the v6 review over r9 ("yes time of day can be released as well
# as duration"); widened by policy v7, owner 2026-10-03: "2-3 weeks ago -> keep", "last year -> keep",
# and weekdays released (the owner chose release when asked); seasons released by policy v9, owner
# 2026-10-04: "redact absolute years and months etc and leave seasons and days of the week". A
# finding holding any `blockers` word, a four-digit number or an ordinal keeps every word: it names an
# absolute date, a holiday or an age, which the policy always masks (src/senselab/text/tasks/pii_detection/data/redaction_policy.yaml).
# An unquantified singular unit releases only after a relative modifier ("last year", not "the year").
# The rule is in specs/20261003-redaction-policy-v7/design.md.
time_of_day: [morning, mornings, afternoon, afternoons, evening, evenings, night, nights, tonight, noon, midnight, midday, dawn, dusk, sunrise, sunset, daytime, nighttime, overnight, bedtime, lunchtime, dinnertime, madrugada, mediodia, noche, noches, tarde, tardes]
