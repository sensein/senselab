# COHORT: the corpus and session pass between QUALITY and VERDICT.
# Read by `senselab.audio.workflows.triage.cohort_stage.cohort_parameters`.
# Derivations: specs/20261007-task-events-in-background/design.md, section "Cohort stage".
version: 6

# Session speaker enrollment. Model, commit and match cut are `speech.enrollment_model` and
# `speech.target_match_cosine`; the shortest span embedded is `comparison.pooled_min_s`.
enrollment:
  families: lexical_speech          # routing_analysis.families.LEXICAL_SPEECH enrolls the participant, less task_speech.yaml voice_task_text (owner, 2026-10-11)
  window_s: 2.0                     # window each span is embedded on, as the speaker vectors were fitted
  hop_s: 1.0                        # its hop
  single_speaker_recordings_min: 2  # this many single-speaker recordings in the session: only they enroll
  leave_one_out_min: 3              # this many enrolling recordings: one under the cut against the rest is left out

# Participant enrollment across sessions: every session's candidates pooled under the rules above.
# Per session, the pool of the participant's other sessions is the fallback where the session has no
# enrollment of its own, and the comparison for session_speaker_consistency.
participant:
  consistency_cosine_min: 0.63  # session vs other-sessions enrollment cosine under this is session_speaker_inconsistent; Tukey lower fence (Q1 - 1.5 IQR) over r18d, UNFITTED against labels

# Speaker comparison: per recording, one embedding pooled over its target speech and one over its speech
# outside the task, each compared with the enrollment. Derivation: design.md, "Pooled speaker comparison".
comparison:
  pooled_min_s: 2.0                     # owner, 2026-10-11: speaker identification needs at least 2 s; a shorter pool is not_measured (too_short_for_speaker_id), and no enrollment span is shorter
  diarization_stream: enhanced          # diarized segments the enrollment reads, each speaker's exclusive pieces
  lexical_gap_key: branch.run_gap_max_s # lexical words merge into one span across gaps up to this config key
  target:                               # what a family's target pool holds: speech (lexical words in the task extent), task_text (task_speech.task_text_ids words) or none
    default: none                       # owner, 2026-10-11: airway, voice and DDK have no target comparison
    kinds:
      lexical_speech: speech            # DECLARED_KIND key -> rule
    families:
      loudness: task_text               # owner, 2026-10-11: compared on its "hey" only (task_speech.yaml voice_task_text)
      loudness-v2: task_text            # owner, 2026-10-11

# Speech the enhancer removed: speech-classified on `from` and not on `kept`. A removed region holding a
# word of speech outside the task joins the non-task pool. Labels and score as data/background_speech.yaml
# (owner, 2026-10-06).
speech:
  labels: [Speech, Conversation, 'Narration, monologue', 'Male speech, man speaking', 'Female speech, woman speaking', 'Child speech, kid speaking']
  score_min: 0.5
  removed: {from: yamnet_scores, kept: enhanced_yamnet_scores}

# Speech outside the task, by family: in a lexical speech task the lexical words outside the task extent;
# elsewhere the task_speech reading's words. In a syllable-repetition family a word spelled only from its
# task syllables is task text.
non_task:
  task_syllables:               # a families.py set -> the syllables its task text is spelled from; a word made only of them is task text
    SYLLABLE_REPETITION: [pa, pah, ta, tah, ka, kah, puh, tuh, kuh, buh, ba, da, ga, butter, cup]

# Distribution checks: each names its level, its bounds and the ground it raises.
quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]
checks:
  recording_duration_outlier:
    level: family
    kinds: [airway, voice]      # declared kinds (routing_analysis.families.DECLARED_KIND) the check reads
    ground: recording_duration_outlier
    duration_ratio_max: 3.0     # longer than this times the family median duration ...
    extent_fraction_min: 0.5    # ... with the task extent covering less than this of the recording
