# COHORT: the corpus and session pass between QUALITY and VERDICT.
# Read by `senselab.audio.workflows.triage.cohort_stage.cohort_parameters`.
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 9

# Session speaker enrollment. Model, commit and match cut are `speech.enrollment_model` and
# `speech.target_match_cosine` (the cut is the enrollment's leave-one-out step only); the shortest span embedded is
# `comparison.pooled_min_s`.
enrollment:
  families: lexical_speech          # the task kind that enrolls the participant, less the tasks with voice_reading_text (tasks.yaml) (owner, 2026-10-11)
  window_s: 2.0                     # window each span is embedded on, as the speaker vectors were fitted
  hop_s: 1.0                        # its hop
  single_speaker_recordings_min:    # profile value (data/profile_values.yaml)
  leave_one_out_min:                # profile value (data/profile_values.yaml)

# Participant enrollment across sessions: every session's candidates pooled under the rules above.
# Per session, the pool of the participant's other sessions is the fallback where the session has no
# enrollment of its own, and the comparison for session_speaker_consistency.
participant:
  consistency_cosine_min:       # profile value (data/profile_values.yaml)

# Recording condition per participant and session (level, SNR, clipping), read by cohort_fold.hot_or_clipped and
# cohort_fold.condition_shift. Derivations: specs/20261007-task-events-in-background/cross-dataset.md, "D1".
condition:
  snr_percentiles: {floor: 10, level: 95}  # energy-envelope percentiles read as floor and active level (recording_vectors/evaluation.yaml frame)
  hot_rms_dbfs_min:                        # profile value (data/profile_values.yaml)
  clipped_fraction_min:                    # profile value (data/profile_values.yaml)
  shift_level_db_min:                      # profile value (data/profile_values.yaml)
  shift_snr_db_min:                        # profile value (data/profile_values.yaml)

# The participant's non-matching speech outside the task, clustered across their recordings (cohort_stage.non_target_voices).
non_target_voice:
  cosine_min:          # profile value (data/profile_values.yaml)
  recurring_min:       # profile value (data/profile_values.yaml)

# A speaker non-match shared across a participant's recordings (cohort_fold.shared_nonmatch).
shared_nonmatch:
  recordings_min: 3     # non-matching recordings, the fewest that can be shared beyond a pair
  fraction_min:         # profile value (data/profile_values.yaml)

# Speaker comparison: per recording, one embedding pooled over its target speech and one over its speech
# outside the task, each compared with the enrollment. Derivation: design.md, "Pooled speaker comparison".
comparison:
  pooled_min_s:                         # profile value (data/profile_values.yaml)
  cosine_min:                           # a pool whose mean window embedding is under this cosine to the enrollment's mean is a non-match
    default:                            # profile value (data/profile_values.yaml)
    task_text:                          # profile value (data/profile_values.yaml)
  diarization_stream: enhanced          # diarized segments the enrollment reads, each speaker's exclusive pieces
  lexical_gap_key: branch.run_gap_max_s # lexical words merge into one span across gaps up to this config key
  target:                               # what a family's target pool holds: speech (lexical words in the task extent), task_text (task_speech.task_text_ids words) or none
    default: none                       # owner, 2026-10-11: airway, voice and DDK have no target comparison
    kinds:
      lexical_speech: speech            # task kind -> rule
    voice_read: task_text               # a word task read for its voice (tasks.yaml voice_reading_text): its task text

# Speech the enhancer removed: speech-classified on `from` and not on `kept`. A removed region holding a
# word of speech outside the task joins the non-task pool. Labels and score as data/background_speech.yaml
# (owner, 2026-10-06).
speech:
  labels: [Speech, Conversation, 'Narration, monologue', 'Male speech, man speaking', 'Female speech, woman speaking', 'Child speech, kid speaking']
  score_min:                            # profile value (data/profile_values.yaml)
  removed: {from: yamnet_scores, kept: enhanced_yamnet_scores}

# Speech outside the task, by family: in a lexical speech task the lexical words outside the task extent;
# elsewhere the task_speech reading's words. In a syllable-repetition family a word spelled only from its
# task syllables is task text.
non_task:
  task_syllables:               # a task kind -> the syllables its task text is spelled from; a word made only of them is task text
    syllable_repetition: [pa, pah, ta, tah, ka, kah, puh, tuh, kuh, buh, ba, da, ga]   # the standard DDK syllables; B2AI adds butter, cup

# Distribution checks: each names its level, its bounds and the ground it raises.
quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]
checks:
  recording_duration_outlier:
    level: family
    kinds: [airway, voice]      # task kinds (task_catalogue.KINDS) the check reads
    ground: recording_duration_outlier
    duration_ratio_max:         # profile value (data/profile_values.yaml)
    extent_fraction_min:        # profile value (data/profile_values.yaml)
