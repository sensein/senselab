# The breathing-pattern measure (breath_pattern.py) and the breath tasks it decides.
#
# A breath task (its kind in the task list, tasks.yaml) is decided on this reading of PREPROCESS's
# stored spectrogram_narrowband (pre-emphasised stream) and phonation_tracks, not on AIRWAY's
# HeAR-scored event detector. Breathing is present where the breath train counts a phase outside the
# review band; inside the band the measure's own events (sustained: `alternating_breaths`; counted: an
# event, no veto) decide between review and no breath. Fewer train breaths (phases / 2, rounded half up)
# than the instruction asked are a task_mismatch annotation, which moves no triage state. Either input
# absent reruns.
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 1
measure:
  breath_band_hz: [150.0, 2500.0]
  flatness_band_hz:                     # profile value (data/profile_values.yaml)
  smooth_s: 0.05
  floor_percentile: 10.0
  rise_db:                              # profile value (data/profile_values.yaml)
  flatness_min:                         # profile value (data/profile_values.yaml)
  voicing_strength_min: 0.45
  merge_gap_s:                          # profile value (data/profile_values.yaml)
  event_s: [0.3, 4.0]
  event_trim_db:              # profile value (data/profile_values.yaml)
  voiced_fraction_max: 0.5
  period_s: [2.0, 8.0]
  autocorr_min:                         # profile value (data/profile_values.yaml)
  interval_s: [0.4, 8.0]
  interval_share_min: # profile value (data/profile_values.yaml)
# The breathing-over-syllabic modulation ratio and the active span of the same spectrogram's subband
# envelopes; the active span feeds the little-activity veto. Derivation in
# specs/20261005-breathing-pattern/design.md ("Modulation cycles").
modulation:
  band_edges_hz: [150.0, 300.0, 500.0, 800.0, 1300.0, 2000.0, 3000.0, 4000.0]
  fs_mod: 20.0                 # envelope rate, Hz
  breath_band_hz: [0.1, 1.2]   # breathing-rate modulation
  syllabic_band_hz: [2.0, 8.0] # syllabic-rate modulation (speech)
  reference_band_hz:                    # profile value (data/profile_values.yaml)
  floor_percentile: 10.0
  active_rise_db:                       # profile value (data/profile_values.yaml)
  min_duration_s:              # profile value (data/profile_values.yaml)
# Vetoes on the measure: a breath the measure finds stands unless the task extent holds speech or too
# little active sound. Fitted on the owner's 56 listened breath recordings (2026-10-06); the derivation,
# with the owner's words, is in specs/20261005-breathing-pattern/design.md ("Breath vetoes over the task
# extent"). Noise and silence no longer veto; the classifier scores are recorded for context only.
veto:
  speech_words_min:            # profile value (data/profile_values.yaml)
  active_fraction_min:         # profile value (data/profile_values.yaml)
  noise_labels: [Vehicle, Car, Engine, Mechanical fan, White noise]   # recorded as context
# The breath train (measure_breath_train): bursts of coherent broadband rise over denoised subband
# envelopes, grouped into the run that is the task; its hull is the breath-task extent and its bursts
# are the counted phases (breaths = phases / 2, rounded half up). Fallbacks: the measure's events,
# padded; then AIRWAY's own hull. Fitted on the owner's 56 annotated figures (2026-10-06); derivation,
# with the owner's words, in specs/20261005-breathing-pattern/design.md ("The breath train").
train:
  band_edges_hz:                        # profile value (data/profile_values.yaml)
  fs_mod:                      # profile value (data/profile_values.yaml)
  smooth_s:                    # profile value (data/profile_values.yaml)
  noise_percentile:            # profile value (data/profile_values.yaml)
  noise_subtract:              # profile value (data/profile_values.yaml)
  tonal_db:                    # profile value (data/profile_values.yaml)
  tonal_halfwidth_bins:                 # profile value (data/profile_values.yaml)
  envelope_smooth_s:           # profile value (data/profile_values.yaml)
  prominence_min:              # profile value (data/profile_values.yaml)
  prominence_range_frac:       # profile value (data/profile_values.yaml)
  weak_prominence_frac:        # profile value (data/profile_values.yaml)
  template_corr_min:                    # profile value (data/profile_values.yaml)
  distance_quick_s:            # profile value (data/profile_values.yaml)
  distance_s:                  # profile value (data/profile_values.yaml)
  burst_s:                              # profile value (data/profile_values.yaml)
  flatness_min:                         # profile value (data/profile_values.yaml)
  voiced_max:                  # profile value (data/profile_values.yaml)
  coherence_min:               # profile value (data/profile_values.yaml)
  coherence_window_s:                   # profile value (data/profile_values.yaml)
  rise_z:                      # profile value (data/profile_values.yaml)
  floor_percentile:            # profile value (data/profile_values.yaml)
  rise_floor_db:               # profile value (data/profile_values.yaml)
  gap_min_s:                   # profile value (data/profile_values.yaml)
  gap_cycles:                  # profile value (data/profile_values.yaml)
  speech_words_min:            # profile value (data/profile_values.yaml)
  speech_gap_s:                         # profile value (data/profile_values.yaml)
  speech_bridge_cycles:        # profile value (data/profile_values.yaml)
  word_spread_max_s:           # profile value (data/profile_values.yaml)
  pad_s:                       # profile value (data/profile_values.yaml)
  continue_db:                 # profile value (data/profile_values.yaml)
  steady_strength_min:         # profile value (data/profile_values.yaml)
  steady_min_s:                # profile value (data/profile_values.yaml)
  steady_f0_cv_max:            # profile value (data/profile_values.yaml)
  voice_gap_s:                 # profile value (data/profile_values.yaml)
  speech_link_s:               # profile value (data/profile_values.yaml)
  edge_min_s:                  # profile value (data/profile_values.yaml)
# The narrow band of kept breath recordings flagged breath_review_low_confidence (flag, not discard):
# a train of fewer than min_phases phases, an irregular cycle with a modest rise, a weak rise, or a
# measure veto named in veto_reviews. Presence is the breath train's (one phase or more); derivation in
# specs/20261005-breathing-pattern/design.md ("The train decides presence").
review:
  min_phases:                           # profile value (data/profile_values.yaml)
  cycle_cv_min:                         # profile value (data/profile_values.yaml)
  irregular_rise_db_max:                # profile value (data/profile_values.yaml)
  weak_rise_db_max:                     # profile value (data/profile_values.yaml)
  veto_reviews: [little_activity]
