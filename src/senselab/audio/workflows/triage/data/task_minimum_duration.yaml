# The shortest recording a declared task can occupy. A recording shorter than its task's minimum
# discards with the ground `too_short_for_task`: a truncated or aborted capture, whatever a branch
# reports from it. `default_s` and the per-task `families` are the dataset profile's.
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 1
default_s:         # profile value (data/profile_values.yaml)
families: {}       # dataset profile: per-family floors (e.g. 0.5 s for a single voluntary cough)
