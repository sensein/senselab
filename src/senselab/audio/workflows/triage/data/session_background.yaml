# The session background read off the residual of the session's speech tasks (session_background.py),
# and the foreground-over-background quality of every recording.
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 1
foreground:                       # the enhanced stream carries speech: either reading suffices
  lexical_words_min:              # profile value (data/profile_values.yaml)
  enhanced_speech_min:            # profile value (data/profile_values.yaml)
  speech_frames_min_s:            # profile value (data/profile_values.yaml)
level:
  percentile: 50.0                # a stream's level over a set of frames: this percentile of its broadband frame level, dB
  spread_percentiles: [10.0, 90.0]  # the residual's within-recording spread
session:
  statistic: median               # the session background per band and broadband, over its members
  members_min:                    # profile value (data/profile_values.yaml)
decides:                          # profile value (data/profile_values.yaml)
decides_kinds: [airway, voice, syllable_repetition]   # the declared kinds whose floor the session background replaces when decides is true
