# Which transcript words are the task's own content: those lying on a task event the task layer read
# (task_content.py, read by nodes/redact.py). Such a word is never PII and never masked. In a
# syllable-repetition task any word on the events; in an airway or voice task only a word the
# recognisers disagree on, one spelled as a sound, or a lexicon word, lying alone on one event. A run of
# agreed dictionary words is never task content.
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 3
families:              # a task kind (task_catalogue.KINDS) -> the task readings whose events are its content
  syllable_repetition: [ddk_task_reading]
  airway: [airway_breath_reading, airway_cough_reading]
  voice: [voice_phonation_reading]
any_word_families: [syllable_repetition]   # task kinds whose every word on the events is task content
agreed_run_min:        # profile value (data/profile_values.yaml)
decisions: [present, review]   # a reading's evidence decision that read the task; `absent` read another activity
overlap:
  pad_s:               # profile value (data/profile_values.yaml)
  min_share:           # profile value (data/profile_values.yaml)
