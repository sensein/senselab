# How a recognizer's word span places a word (consensus.located_span).
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 2
point_width_s:         # profile value (data/profile_values.yaml)

# Where the recognizers place a word far apart, the word takes the time that falls on sound (consensus.arbitrate_time,
# word_arbitration.py); the text is never changed. Derivation: specs/20261012-r37-words-speaker/design.md ("B1").
arbitration:
  disagreement_s:             # profile value (data/profile_values.yaml)
  held_voicing_min_s:         # profile value (data/profile_values.yaml)
  held_voicing_bridge_s:      # profile value (data/profile_values.yaml)
  voiced_strength_min: 0.45   # periodicity strength at which a phonation-track frame is voiced (voice_phonation.yaml f0.strength_min)
