# Another voice anywhere in a recording (background_speech.py), read off what speech enhancement
# removed, over the whole file.
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 2
speech_labels: [Speech, Conversation, 'Narration, monologue', 'Male speech, man speaking', 'Female speech, woman speaking', 'Child speech, kid speaking', Television, Radio]
speech_min:                # profile value (data/profile_values.yaml)
own_share_max:             # profile value (data/profile_values.yaml)
residual_rise_db:          # profile value (data/profile_values.yaml)
floor_frame_s:             # profile value (data/profile_values.yaml)
floor_percentile:          # profile value (data/profile_values.yaml)
envelope_frame_s: 0.02
leakage_corr_min:          # profile value (data/profile_values.yaml)
windows_min: 1
harmonic_band_hz:                       # profile value (data/profile_values.yaml)
f0_range_hz:                            # profile value (data/profile_values.yaml)
frame_s: 0.04
frame_hop_s: 0.01
harmonicity_min:           # profile value (data/profile_values.yaml)
harmonic_rise_db:          # profile value (data/profile_values.yaml)
event_pad_s:               # profile value (data/profile_values.yaml)
run_gap_s:                              # profile value (data/profile_values.yaml)
run_min_s:                 # profile value (data/profile_values.yaml)
run_voiced_min_s:          # profile value (data/profile_values.yaml)
thinned_db:                # profile value (data/profile_values.yaml)
