# Another voice anywhere in a recording (background_speech.py), read off what speech enhancement
# removed. Owner, 2026-10-06, on 6ca9935e; whole-file reading 2026-10-10. The derivations are in
# specs/20261006-cough-pattern/design.md ("Background speech in the task") and
# specs/20261007-task-events-in-background/design.md ("QUALITY's other-voice reading reads the whole
# file"). Values marked UNFITTED are to be fitted on the owner's labels.
version: 2
speech_labels: [Speech, Conversation, 'Narration, monologue', 'Male speech, man speaking', 'Female speech, woman speaking', 'Child speech, kid speaking', Television, Radio]
speech_min: 0.5            # a residual window's highest speech-label score at or above: speech heard
own_share_max: 0.5         # UNFITTED: a window's residual energy inside the participant's padded events at or above: their own sound
residual_rise_db: 15.0     # UNFITTED against the frame floor: residual over its own floor at or above: the enhancer removed something
floor_frame_s: 0.05        # UNFITTED: the frame the residual's floor is read in
floor_percentile: 5.0      # UNFITTED: the percentile of the residual's frame levels taken as its floor
envelope_frame_s: 0.02
leakage_corr_min: 0.5      # residual-enhanced envelope correlation at or above: the participant's sound leaking
windows_min: 1
harmonic_band_hz: [100.0, 3800.0]
f0_range_hz: [80.0, 400.0]
frame_s: 0.04
frame_hop_s: 0.01
harmonicity_min: 0.5       # normalised autocorrelation peak of a harmonic residual frame
harmonic_rise_db: 10.0     # over the residual's own frame floor
event_pad_s: 0.3           # sound this close to a participant's event is that event's
run_gap_s: 0.3
run_min_s: 1.0             # a harmonic residual run off the events this long ...
run_voiced_min_s: 0.5      # ... holding this much harmonic time ...
thinned_db: [1.0, 10.0]    # ... with plain over enhanced in this range (part removed, foreground kept) is another voice
