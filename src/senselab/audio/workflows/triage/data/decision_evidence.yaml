# The decision table's evidence items: the name of every reading the fold weighs, by family group.
# Each item records value, unit, comparison, threshold (from data/), effect and whether it decided.
# `producer` names the unit of specs/20261007-task-events-in-background/design.md that emits it;
# an item a later unit produces is absent from the tables until that unit lands.
version: 2
groups:
  acquisition:
    admit_outcome:
      unit:
      producer: fold
      meaning: ADMIT's outcome; a fail discards the recording as unmeasurable
    task_duration_s:
      unit: s
      producer: fold
      meaning: the recording's duration against its family's minimum in data/task_minimum_duration.yaml
    route_state:
      unit:
      producer: fold
      meaning: the ruleset's reading of the whole recording; empty with the task not performed discards
    declared_task_found:
      unit:
      producer: fold
      meaning: whether the branch owning the declared task found it
    streams_disagree:
      unit:
      producer: unit C
      meaning: the share of the raw stream's standing task events the enhanced stream loses, against data/quality_join.yaml streams.lost_fraction
    nothing_captured:
      unit:
      producer: unit C
      meaning: the route state, the plain and enhanced streams' active seconds and the level against the session; no activity, or only the room, with no task event discards
    level_rel_db:
      unit: dB
      producer: unit C
      meaning: the recording's active level against its BIDS session's (SESSION)
  breath:
    breath_event_db_over_floor:
      unit: dB
      producer: unit B
      meaning: the strongest breath event's level over the stationary floor, against data/task_events.yaml decision.snr_low_db
    breath_event_db_over_local:
      unit: dB
      producer: unit B
      meaning: that event's level over its local background, against decision.snr_high_db
    breath_events_entangled:
      unit:
      producer: unit B
      meaning: whether an impulse overlaps or abuts every clear breath event
    breaths_found:
      unit: breaths
      producer: unit B
      meaning: breaths the train counted, against the instructed count
    breath_rhythm_hz:
      unit: Hz
      producer: unit B
      meaning: the breathing-band modulation rate; a prior, never a decision
  cough:
    cough_onsets:
      unit: coughs
      producer: unit B
      meaning: cough onsets found; none discards
    coughs_against_instructed:
      unit: coughs
      producer: unit B
      meaning: coughs found against the instructed count
    cough_review:
      unit:
      producer: unit B
      meaning: whether the cough count sits in the review band
  voice:
    phonation_found:
      unit:
      producer: unit B
      meaning: whether phonation stands over the floor
    phonation_voiced_s:
      unit: s
      producer: unit B
      meaning: voiced time inside the phonation extent
    longest_hold_s:
      unit: s
      producer: unit B
      meaning: the longest held phonation
    glide_travel_declared_st:
      unit: semitones
      producer: unit B
      meaning: the glide's travel in the declared direction
  ddk:
    ddk_event_db_over_floor:
      unit: dB
      producer: DDK task layer
      meaning: the strongest syllable or cycle event's level over the stationary floor, against data/task_events.yaml decision.snr_low_db; none standing discards
    ddk_identity:
      unit:
      producer: DDK task layer
      meaning: the standing task events' median identity against the declared template, against ddk.identity_min (review under it) and ddk.identity_absent_max (another activity under it, discards)
    ddk_clear_events:
      unit: events
      producer: DDK task layer
      meaning: task events clear of their local background with no impulse from outside the train touching them, against ddk.events_min
    ddk_events_against_instructed:
      unit: events
      producer: DDK task layer
      meaning: task events (cycles or syllables) in the dominant cluster against the instructed count
    ddk_events_found:
      unit: events
      producer: DDK task layer
      meaning: task events in the dominant cluster, where the instruction speaks no count
    ddk_syllable_rate_hz:
      unit: Hz
      producer: DDK task layer
      meaning: syllables per second over the syllables' onset intervals inside each run
    ddk_cycle_rate_hz:
      unit: Hz
      producer: DDK task layer
      meaning: cycles per second over the cycle events' onset intervals (sequence families)
    ddk_period_cv:
      unit:
      producer: DDK task layer
      meaning: the coefficient of variation of the task events' onset intervals
    ddk_period_trend_s_per_step:
      unit: s
      producer: DDK task layer
      meaning: how the onset interval changes across the train, seconds per event
    ddk_train_fraction:
      unit:
      producer: DDK task layer
      meaning: the task extent over the recording's duration
    ddk_realised_mass:
      unit:
      producer: DDK task layer
      meaning: per template position, the class mass the identity alignment realised, averaged over the task events
  speech:
    lexical_words:
      unit: words
      producer: fold
      meaning: lexical words in the consensus transcript
  release:
    release_ground:
      unit:
      producer: fold
      meaning: why the release axis reads as it does; a withholding ground holds the recording
prefixes:              # `<prefix>:<name>` items, named by what follows the colon
  gate:
    group: speech
    unit:
    producer: fold
    meaning: a task-group or flag gate's reading against its bound
  fault_in_task:
    group: acquisition
    unit: s
    producer: unit C
    meaning: a capture fault (shutoff, dropout, clip) touching a task span, against data/quality_join.yaml faults.<kind>.min_s
  interference_in_task:
    group: acquisition
    unit: spans
    producer: unit C
    meaning: another source (another voice) overlapping or abutting a task span
  phonation_review:
    group: voice
    unit:
    producer: unit B
    meaning: a phonation reading that leaves the recording for review
flags:                 # every other item is a ground key of data/decision_reasons.yaml, read as a flag
  group: acquisition
  unit:
  producer: fold
  meaning: a ground the fold raised; its reason is in data/decision_reasons.yaml
