# The recording-level background model QUALITY reads off every recording (background_model.py).
# Task-independent: a per-band stationary floor estimated outside the active regions, mains hum on
# the residual, impulses, regions of activity, and the acquisition faults.
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 2
frame_s: 0.04                     # analysis window of the band frames, as voice_phonation.yaml
hop_s: 0.01                       # hop of every per-frame series
band_edges_hz: [150.0, 300.0, 500.0, 800.0, 1300.0, 2000.0, 3000.0, 4000.0, 5500.0, 7500.0]   # the breath train's subbands
digital_floor_dbfs: -90.0         # frames under this are digital silence, never the noise floor
floor_smooth_s: 0.1               # the shutoff's live floor is the quietest window this long, as VOICE
phonation_db:                     # profile value (data/profile_values.yaml)
floor:
  initial_percentile: 10.0        # first-pass floor per band, over live frames
  iterations: 4                   # re-estimates with the active regions removed
  pad_s:                          # profile value (data/profile_values.yaml)
  quiet_percentile: 50.0          # the floor is this percentile of the quiet frames per band
  quiet_min_s:                    # profile value (data/profile_values.yaml)
  residual_percentile: 20.0       # the residual's per-band floor, read over its live frames
  residual_gap_db:                # profile value (data/profile_values.yaml)
activity:
  margin_db:                      # profile value (data/profile_values.yaml)
  band_fraction:                  # profile value (data/profile_values.yaml)
  bridge_s:                       # profile value (data/profile_values.yaml)
  min_s:                          # profile value (data/profile_values.yaml)
  peak_window_db: 3.0             # onset and offset are read where the level comes within this of the peak
impulse:
  envelope_ms: 2.0                # window of the pre-emphasised sample envelope
  background_ms: 200.0            # running-median window the envelope is read against
  peak_db:                        # profile value (data/profile_values.yaml)
  onset_db:                       # profile value (data/profile_values.yaml)
  attack_max_ms:                  # profile value (data/profile_values.yaml)
  duration_max_ms:                # profile value (data/profile_values.yaml)
  isolation_ms: 30.0              # and no other candidate stands this close; a glottal pulse train is not alone
hum:
  mains_hz: [50.0, 60.0]          # mains fundamentals
  harmonics_max: 10               # multiples of each read
  line_db:                        # profile value (data/profile_values.yaml)
  neighbourhood_hz:               # profile value (data/profile_values.yaml)
  lines_min:                      # profile value (data/profile_values.yaml)
shutoff:                          # as voice_phonation.yaml, now read on every recording
  below_floor_db:                       # profile value (data/profile_values.yaml)
  drop_db:                              # profile value (data/profile_values.yaml)
  drop_s:                               # profile value (data/profile_values.yaml)
  flat_window_s: 0.3
  flat_db:                              # profile value (data/profile_values.yaml)
  bridge_s:                             # profile value (data/profile_values.yaml)
  min_s:                                # profile value (data/profile_values.yaml)
disruptions:                      # dropout and discontinuity extents on the original recording
  min_dropout_ms: 10.0            # as disruptions.min_dropout_ms in config/default.yaml
  discontinuity_local_factor: 10.0
  discontinuity_window_ms: 20.0
  merge_s:                        # profile value (data/profile_values.yaml)
session:                          # the BIDS session floor (specs/.../design.md, "Unit C step 1")
  statistic: median               # per band, over the members whose own floor was read over quiet frames
  members_min:                    # profile value (data/profile_values.yaml)
  gap_db:                         # profile value (data/profile_values.yaml)
  level_percentile: 95.0          # a recording's active level: this percentile of its broadband level over live frames
