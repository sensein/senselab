# Discard where the task is absent or weak and talk outside it takes its place (discard_replaced_task.py).
# Derivations: specs/20261007-task-events-in-background/cross-dataset.md, "E1".
version: 2
enabled:                           # profile value (data/profile_values.yaml)

background:                        # r37 round 2: the task's events against the recording's background (task_events.background_reading)
  enabled:                         # profile value (data/profile_values.yaml)
  kinds: [airway]
  event_over_background_db_max:        # profile value (data/profile_values.yaml)

non_lexical:                       # airway, voice, and the lexical families read as a voice task
  kinds: [airway, voice]
  voice_read: true                 # a word task the task list reads for its voice (voice_reading_text)
  free_speech_words_per_s:         # profile value (data/profile_values.yaml)
  talk_fraction_min:               # profile value (data/profile_values.yaml)
  extent_fraction_max:             # profile value (data/profile_values.yaml)

lexical:                           # lexical speech, less the word tasks read for their voice
  kinds: [lexical_speech]
  voice_read: false                # less the word tasks read for their voice

short_response:                    # free-response families: a response under fraction_max of the family median
  fraction_max:                         # profile value (data/profile_values.yaml)
  family_median_s:                 # profile value (data/profile_values.yaml): median response per family
