# The task layer's shared reading (task_events.py): each branch's candidate events read against the
# recording-level background, the rhythm prior, the dominant cluster, the extent and the decision.
# Derivations are in specs/20261007-task-events-in-background/design.md ("Unit B: the task layer").
version: 2
entangle_abut_s:                 # profile value (data/profile_values.yaml)
impulse_margin_db:               # profile value (data/profile_values.yaml)
local:
  window_s:                      # profile value (data/profile_values.yaml)
  percentile:                    # profile value (data/profile_values.yaml)
decision:
  snr_low_db:                    # profile value (data/profile_values.yaml)
  snr_high_db:                   # profile value (data/profile_values.yaml)
extent:                          # which cluster of events is the task (task_cluster); design "Decide on the extent's own events" (2026-10-10)
  speech_words_min:              # profile value (data/profile_values.yaml)
  speech_gap_s:                  # profile value (data/profile_values.yaml)
  speech_score_min:              # profile value (data/profile_values.yaml)
  count_weight:                  # profile value (data/profile_values.yaml)
  position_weight:               # profile value (data/profile_values.yaml)
  events_per_instructed:         # task events one instructed unit gives
    breath: 2                    # an inhale and an exhale phase
    cough: 1
inhale:
  margin_db:                     # profile value (data/profile_values.yaml)
  back_max_s:                    # profile value (data/profile_values.yaml)
rhythm:
  band_hz: [0.1, 1.2]            # the breathing band (C3)
  prominence_min_db:             # profile value (data/profile_values.yaml)
breath:
  gap_min_s:                     # profile value (data/profile_values.yaml)
  gap_cycles:                    # profile value (data/profile_values.yaml)
  recover_voiced_max:            # profile value (data/profile_values.yaml)
cough:
  gap_s:                         # profile value (data/profile_values.yaml)
voice:
  gap_s:                         # profile value (data/profile_values.yaml)
ddk:                             # the diadochokinesis task layer (ddk_task.py); design "DDK task layer"
  voicing_strength_min: 0.45     # a pitch-track frame is voiced at or over this strength, as breath_pattern.yaml
  smooth_s: 0.03                 # the nucleus series is smoothed over this
  unvoiced_db:                   # profile value (data/profile_values.yaml)
  nucleus_prominence_db:         # profile value (data/profile_values.yaml)
  nucleus_spacing_s:             # profile value (data/profile_values.yaml)
  syllable_min_s:                # profile value (data/profile_values.yaml)
  syllable_max_s:                # profile value (data/profile_values.yaml)
  cycle_band_hz:                 # profile value (data/profile_values.yaml)
  rhythm_prominence_min_db:      # profile value (data/profile_values.yaml)
  rhythm_agreement:              # profile value (data/profile_values.yaml)
  gap_s:                         # profile value (data/profile_values.yaml)
  identity_pad_s:                # profile value (data/profile_values.yaml)
  skip_log:                      # profile value (data/profile_values.yaml)
  events_min:                    # UNFITTED (N_min): clear events a present decision needs
    syllable:                           # profile value (data/profile_values.yaml)
    cycle:                              # profile value (data/profile_values.yaml)
  identity_min:                  # profile value (data/profile_values.yaml)
  identity_absent_max:           # profile value (data/profile_values.yaml)
