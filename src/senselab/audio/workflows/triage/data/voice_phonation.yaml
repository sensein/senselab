# The VOICE phonation measure (voice_phonation.py).
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 1
frame_s: 0.04                     # analysis window of the level and spectrum frames
hop_s: 0.01                       # hop of every per-frame series
band_hz:                          # profile value (data/profile_values.yaml)
floor_smooth_s:                   # profile value (data/profile_values.yaml)
digital_floor_dbfs: -90.0         # frames under this are digital silence, never the noise floor
phonation_db:                     # profile value (data/profile_values.yaml)
voiced_rise_db:                   # profile value (data/profile_values.yaml)
vowel_word_pattern: ^[aeiouhym]+$    # a consensus word spelled like this is the vowel itself, not speech
speech_word_max_s:                # profile value (data/profile_values.yaml)
break_min_s:                      # profile value (data/profile_values.yaml)
segment_min_s:                    # profile value (data/profile_values.yaml)
merge_gap_max_s:                  # profile value (data/profile_values.yaml)
merge_voiced_fraction_min:        # profile value (data/profile_values.yaml)
merge_db:                         # profile value (data/profile_values.yaml)
extent_min_s:                     # profile value (data/profile_values.yaml)
inhale:
  rise_db:                        # profile value (data/profile_values.yaml)
  max_s:                          # profile value (data/profile_values.yaml)
  gap_s:                          # profile value (data/profile_values.yaml)
  min_s:                          # profile value (data/profile_values.yaml)
f0:
  range_hz:                       # profile value (data/profile_values.yaml)
  strength_min: 0.45              # periodicity strength at which a frame is voiced
  octave_db:                      # profile value (data/profile_values.yaml)
  harmonics:                      # profile value (data/profile_values.yaml)
  fold_window_s:                  # profile value (data/profile_values.yaml)
  fold_semitones:                 # profile value (data/profile_values.yaml)
  spread_window_s:                # profile value (data/profile_values.yaml)
glide:
  range_min_semitones:            # profile value (data/profile_values.yaml)
  jump_max_semitones:             # profile value (data/profile_values.yaml)
  smoothing_frames:               # profile value (data/profile_values.yaml)
  voiced_min_s:                   # profile value (data/profile_values.yaml)
hum:
  mains_hz: [50.0, 60.0]          # mains fundamentals
  harmonics_max:                  # profile value (data/profile_values.yaml)
  line_db:                        # profile value (data/profile_values.yaml)
  neighbourhood_hz:               # profile value (data/profile_values.yaml)
  lines_min:                      # profile value (data/profile_values.yaml)
  lock_fraction_min:              # profile value (data/profile_values.yaml)
  tolerance_hz:                   # profile value (data/profile_values.yaml)
  disagreement_s:                 # profile value (data/profile_values.yaml)
  enhanced_drop_db:               # profile value (data/profile_values.yaml)
shutoff:
  below_floor_db:                 # profile value (data/profile_values.yaml)
  drop_db:                        # profile value (data/profile_values.yaml)
  drop_s:                         # profile value (data/profile_values.yaml)
  flat_window_s:                  # profile value (data/profile_values.yaml)
  flat_db:                        # profile value (data/profile_values.yaml)
  bridge_s:                       # profile value (data/profile_values.yaml)
  min_s:                          # profile value (data/profile_values.yaml)
  gap_s:                          # profile value (data/profile_values.yaml)
speech:
  run_min_s:                      # profile value (data/profile_values.yaml)
  voiced_fraction_min:            # profile value (data/profile_values.yaml)
review:
  floor_margin_db:                # profile value (data/profile_values.yaml)
  glide_margin_semitones:         # profile value (data/profile_values.yaml)
