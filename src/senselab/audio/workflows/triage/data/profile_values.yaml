# Every value senselab leaves to a dataset profile (plan step 5c), by data file: its key path, its kind, and whether
# a run needs it. A run whose profile, with the profiles it extends, leaves a required value empty is refused before
# any node runs, naming every one (dataset_profile.missing_dataset_values).
#   kind: a  decide: the dataset's policy (release, review, redaction; which features are on)
#         b  computed from the dataset's own recordings (a percentile, a fence, a median): step 10 fits them
#         c  needs listening or labelled recordings: detector tuning and model cut-offs; senselab's
#            adult_clinical_speech profile carries a set fitted on Bridge2AI-Voice adult
#         d  per task
#   required: false where the value switches a feature off or nothing reads it yet, so it may stay empty.
