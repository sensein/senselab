# Every value senselab leaves to a dataset profile (plan step 5c), by data file: its key path, its kind, and whether
# a run needs it. A run whose profile, with the profiles it extends, leaves a required value empty is refused before
# any node runs, naming every one (dataset_profile.missing_dataset_values).
#   kind: a  decide: the dataset's policy (release, review, redaction; which features are on)
#         b  computed from the dataset's own recordings (a percentile, a fence, a median): step 10 fits them
#         c  needs listening or labelled recordings: detector tuning and model cut-offs; senselab's
#            adult_clinical_speech profile carries a set fitted on Bridge2AI-Voice adult
#         d  per task
#   unit, means, fit: what the value is and how a dataset sets it (the template writes them beside each blank).
#   required: false where the value switches a feature off or nothing reads it yet, so it may stay empty.
version: 1
values:
  asr_degenerate.yaml:
  - path: ["chars_min"]
    kind: c
    required: true
    unit: "count (characters)"
    means: "Letters and digits in one recognizer token at or above which the token is a decoder loop, not a word."
    fit: "Tuned against labelled recordings (measured, not by listening): which long tokens are decoder loops rather than words; the reference profile carries a value fitted on adult clinical speech."
  - path: ["repeats_min"]
    kind: c
    required: true
    unit: "count"
    means: "Back-to-back repeats of one short unit at or above which a recognizer token is a decoder loop."
    fit: "Tuned against labelled recordings (measured, not by listening): which repeated-unit tokens are decoder loops rather than words; the reference profile carries a value fitted on adult clinical speech."
  - path: ["unit_chars_max"]
    kind: c
    required: true
    unit: "count (characters)"
    means: "Longest repeating unit searched for when testing a recognizer token for a decoder loop."
    fit: "Tuned by listening to labelled recordings: the longest unit a decoder loop repeats; no derivation written; the reference profile carries the value set on adult clinical speech."
  background_model.yaml:
  - path: ["activity", "band_fraction"]
    kind: c
    required: true
    unit: "fraction (0-1)"
    means: "Share of frequency bands that must stand over their floor for an analysis frame to count as active."
    fit: "Tuned by listening to labelled recordings: which frames hold sound rather than background; unfitted: the reference profile carries a placeholder set on adult clinical speech."
  - path: ["activity", "bridge_s"]
    kind: c
    required: true
    unit: "s"
    means: "Longest gap across which two active regions are joined into one region."
    fit: "Tuned by listening to labelled recordings: where one sound region ends and the next begins; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["activity", "margin_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Level over a band's background floor at which that band counts as active in a frame."
    fit: "Tuned by listening to labelled recordings: which frames hold sound rather than background; unfitted: the reference profile carries a placeholder set on adult clinical speech."
  - path: ["activity", "min_s"]
    kind: c
    required: true
    unit: "s"
    means: "Shortest active region kept by the background model."
    fit: "Tuned by listening to labelled recordings: the shortest sound worth a region; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["disruptions", "merge_s"]
    kind: c
    required: true
    unit: "s"
    means: "Signal discontinuities closer together than this are merged into one disruption span."
    fit: "Tuned by listening to labelled recordings: when neighbouring discontinuities are one disruption; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["floor", "pad_s"]
    kind: c
    required: true
    unit: "s"
    means: "Widening applied to active frames before the background floor is re-read without them."
    fit: "Tuned by listening to labelled recordings: how far sound spills past its active frames; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["floor", "quiet_min_s"]
    kind: c
    required: true
    unit: "s"
    means: "Least quiet time a recording needs for its own background floor to be read; less uses the residual's floor."
    fit: "Tuned by listening to labelled recordings: how much quiet a floor estimate needs; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["floor", "residual_gap_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Own floor this far above the enhancement residual's floor means the task fills the file; the residual floor is used."
    fit: "Tuned by listening to labelled recordings: recordings whose task fills the file, so their quiet frames are the task (design Unit A names held vowels filling the file); no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["hum", "line_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Level a mains-hum line must stand over its spectral neighbourhood to count as a hum line."
    fit: "Tuned by listening to labelled recordings: which recordings carry mains hum; the reference profile carries a value fitted on adult clinical speech."
  - path: ["hum", "lines_min"]
    kind: c
    required: true
    unit: "count"
    means: "Mains-frequency multiples that must stand out in the residual for hum to be detected."
    fit: "Tuned by listening to labelled recordings: which recordings carry mains hum; the reference profile carries a value fitted on adult clinical speech."
  - path: ["hum", "neighbourhood_hz"]
    kind: c
    required: true
    unit: "Hz range [near, far]"
    means: "Frequency offsets either side of a mains line over which its neighbourhood level is read."
    fit: "Tuned by listening to labelled recordings: which recordings carry mains hum; the reference profile carries a value fitted on adult clinical speech."
  - path: ["impulse", "attack_max_ms"]
    kind: c
    required: true
    unit: "ms"
    means: "Longest rise time of an envelope peak that still counts as an impulse such as a click or knock."
    fit: "Tuned by listening to labelled recordings: which peaks are clicks or knocks rather than breaths or voice; unfitted: the reference profile carries a placeholder set on adult clinical speech."
  - path: ["impulse", "duration_max_ms"]
    kind: c
    required: true
    unit: "ms"
    means: "Longest time an impulse may take to fall back to its background; a quick breath lasts longer."
    fit: "Tuned by listening to labelled recordings: which peaks are clicks or knocks rather than breaths or voice; unfitted: the reference profile carries a placeholder set on adult clinical speech."
  - path: ["impulse", "onset_db"]
    kind: c
    required: true
    unit: "dB"
    means: "An impulse candidate starts and ends where its envelope falls back within this of its background."
    fit: "Tuned by listening to labelled recordings: where a click begins and ends; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["impulse", "peak_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Envelope peak height over its running background that makes an impulse candidate."
    fit: "Tuned by listening to labelled recordings: which envelope peaks are candidate clicks or knocks; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["phonation_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Level over the floor a frame must reach before a following abrupt drop can count as a shutoff."
    fit: "Tuned by listening to labelled recordings: whether a signal was sounding before it cut off; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["session", "gap_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Own floor this far above the session's shared floor makes the recording take the session floor instead."
    fit: "Tuned by listening to labelled recordings: recordings whose own floor is raised by the task, so the session floor is the better background; unfitted: the reference profile carries a placeholder set on adult clinical speech."
  - path: ["session", "members_min"]
    kind: c
    required: true
    unit: "count"
    means: "Fewest usable recordings a session needs before its shared background floor is used."
    fit: "Tuned by listening to labelled recordings: how many recordings make a session floor trustworthy; unfitted: the reference profile carries a placeholder set on adult clinical speech."
  - path: ["shutoff", "below_floor_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Depth under the live-frame floor at which a frame counts as dead (recorder cut off)."
    fit: "Tuned by listening to labelled recordings: whether the recorder cut off during the task; the reference profile carries a value fitted on adult clinical speech (same detector as voice_phonation; read off a listened shutoff (click, decay, flat plateau under the room noise))."
  - path: ["shutoff", "bridge_s"]
    kind: c
    required: true
    unit: "s"
    means: "Longest gap across which dead runs are joined into one shutoff run."
    fit: "Tuned by listening to labelled recordings: whether the recorder cut off during the task; the reference profile carries a value fitted on adult clinical speech (same detector as voice_phonation; read off a listened shutoff (click, decay, flat plateau under the room noise))."
  - path: ["shutoff", "drop_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Level fall within drop_s that makes the entry into a dead stretch abrupt."
    fit: "Tuned by listening to labelled recordings: whether the recorder cut off during the task; the reference profile carries a value fitted on adult clinical speech (same detector as voice_phonation; read off a listened shutoff (click, decay, flat plateau under the room noise))."
  - path: ["shutoff", "drop_s"]
    kind: c
    required: true
    unit: "s"
    means: "Time within which the level must fall for an abrupt shutoff."
    fit: "Tuned by listening to labelled recordings: whether the recorder cut off during the task; the reference profile carries a value fitted on adult clinical speech (same detector as voice_phonation; read off a listened shutoff (click, decay, flat plateau under the room noise))."
  - path: ["shutoff", "flat_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Largest 10th-to-90th percentile level spread a dead stretch may show."
    fit: "Tuned by listening to labelled recordings: whether the recorder cut off during the task; the reference profile carries a value fitted on adult clinical speech (same detector as voice_phonation; read off a listened shutoff (click, decay, flat plateau under the room noise))."
  - path: ["shutoff", "min_s"]
    kind: c
    required: true
    unit: "s"
    means: "Shortest dead run reported as a recorder shutoff."
    fit: "Tuned by listening to labelled recordings: whether the recorder cut off during the task; the reference profile carries a value fitted on adult clinical speech (same detector as voice_phonation; read off a listened shutoff (click, decay, flat plateau under the room noise))."
  background_speech.yaml:
  - path: ["event_pad_s"]
    kind: c
    required: true
    unit: "s"
    means: "Sound this close to one of the participant's own events is attributed to that event, not another voice."
    fit: "Tuned by listening to labelled recordings: how far a participant's own sound spreads around an event; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["f0_range_hz"]
    kind: c
    required: true
    unit: "Hz range [min, max]"
    means: "Pitch range searched when testing a residual frame for harmonic (voiced) structure."
    fit: "Tuned by listening to labelled recordings: which residual frames are voiced; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["floor_frame_s"]
    kind: c
    required: true
    unit: "s"
    means: "Frame length over which the enhancement residual's floor is read."
    fit: "Tuned by listening to labelled recordings: where another voice sits over the residual's floor; unfitted: the reference profile carries a placeholder set on adult clinical speech (chosen shorter than a syllable so pauses in talk give floor frames)."
  - path: ["floor_percentile"]
    kind: c
    required: true
    unit: "percentile"
    means: "Percentile of the residual's frame levels taken as its floor."
    fit: "Tuned by listening to labelled recordings: where another voice sits over the residual's floor; unfitted: the reference profile carries a placeholder set on adult clinical speech."
  - path: ["harmonic_band_hz"]
    kind: c
    required: true
    unit: "Hz range [min, max]"
    means: "Frequency band in which residual harmonicity is measured."
    fit: "Tuned by listening to labelled recordings: which residual frames are voiced; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["harmonic_rise_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Level over the residual's own frame floor a harmonic residual frame must reach."
    fit: "Tuned by listening to labelled recordings: which residual frames carry a voice; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["harmonicity_min"]
    kind: c
    required: true
    unit: "fraction (0-1, normalised autocorrelation)"
    means: "Normalised autocorrelation peak at or above which a residual frame is harmonic."
    fit: "Tuned by listening to labelled recordings: which residual frames are voiced; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["leakage_corr_min"]
    kind: c
    required: true
    unit: "correlation (-1 to 1)"
    means: "Residual-to-enhanced envelope correlation at or above which the residual is the participant's own sound leaking."
    fit: "Tuned by listening to labelled recordings: whether removed sound is the participant's own leakage or another source; the reference profile carries a value fitted on adult clinical speech."
  - path: ["own_share_max"]
    kind: c
    required: true
    unit: "fraction (0-1)"
    means: "Share of a window's residual energy inside the participant's padded events at or above which it is their own sound."
    fit: "Tuned by listening to labelled recordings: whether residual sound is the participant's own; unfitted: the reference profile carries a placeholder set on adult clinical speech."
  - path: ["residual_rise_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Residual level over its own floor at or above which speech enhancement removed something."
    fit: "Tuned by listening to labelled recordings: whether the enhancer removed a sound; unfitted: the reference profile carries a placeholder set on adult clinical speech (kept from before the floor was lowered)."
  - path: ["run_gap_s"]
    kind: c
    required: true
    unit: "s"
    means: "Longest gap inside one run of harmonic residual frames."
    fit: "Tuned by listening to labelled recordings: where one residual voice run ends; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["run_min_s"]
    kind: c
    required: true
    unit: "s"
    means: "Shortest harmonic residual run, away from the participant's events, that can be another voice."
    fit: "Tuned by listening to labelled recordings: whether a residual run is another voice; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["run_voiced_min_s"]
    kind: c
    required: true
    unit: "s"
    means: "Least harmonic time a residual run must hold to count as another voice."
    fit: "Tuned by listening to labelled recordings: whether a residual run is another voice; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["speech_min"]
    kind: c
    required: true
    unit: "score (0-1)"
    means: "Highest speech-label classifier score in a residual window at or above which speech is heard."
    fit: "Tuned by listening to labelled recordings: which residual windows hold speech; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["thinned_db"]
    kind: c
    required: true
    unit: "dB range [min, max]"
    means: "Plain-over-enhanced level range marking a run partly removed with the foreground kept, i.e. another voice."
    fit: "Tuned by listening to labelled recordings: whether the enhancer removed a second voice and kept the participant; no derivation written; the reference profile carries the value set on adult clinical speech."
  breath_pattern.yaml:
  - path: ["measure", "autocorr_min"]
    kind: c
    required: true
    unit: "correlation (0-1)"
    means: "Envelope autocorrelation peak needed for a breathing rhythm, read only once breath events are found."
    fit: "Tuned by listening to labelled recordings: whether breathing is heard; the reference value is a pilot setting chosen from breath anatomy and checked on 23 listened breath recordings; rhythm alone is not evidence since silent recordings reached 0.56-0.86, not fitted to labels."
  - path: ["measure", "event_trim_db"]
    kind: c
    required: true
    unit: "dB"
    means: "A breath event's span is the frames within this of its own peak; affects display and extent only."
    fit: "Tuned by listening to labelled recordings: where a breath event's audible span ends; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["measure", "flatness_band_hz"]
    kind: c
    required: true
    unit: "Hz range [min, max]"
    means: "Frequency band over which spectral flatness separates noise-like breath from harmonic voice."
    fit: "Tuned by listening to labelled recordings: whether breathing is heard; the reference value is a pilot setting chosen from breath anatomy and checked on 23 listened breath recordings; breath turbulence sits low and above 150 Hz excludes hum and handling rumble, not fitted to labels."
  - path: ["measure", "flatness_min"]
    kind: c
    required: true
    unit: "fraction (0-1)"
    means: "Spectral flatness at or above which a frame is noise-like breath rather than voice."
    fit: "Tuned by listening to labelled recordings: whether breathing is heard; the reference value is a pilot setting chosen from breath anatomy and checked on 23 listened breath recordings; 0.08 separated breath from voice on the labelled set, not fitted to labels."
  - path: ["measure", "interval_share_min"]
    kind: c
    required: true
    unit: "fraction (0-1)"
    means: "Share of event onset intervals that must fall in the breathing-cycle range to read a rhythm."
    fit: "Tuned by listening to labelled recordings: whether breathing is heard; the reference value is a pilot setting chosen from breath anatomy and checked on 23 listened breath recordings, not fitted to labels."
  - path: ["measure", "merge_gap_s"]
    kind: c
    required: true
    unit: "s"
    means: "Gap across which active frames merge into one breath event."
    fit: "Tuned by listening to labelled recordings: whether breathing is heard; the reference value is a pilot setting chosen from breath anatomy and checked on 23 listened breath recordings; the design notes it wants revisiting with labels, not fitted to labels."
  - path: ["measure", "rise_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Level over the recording's own 10th-percentile envelope at which a frame is active."
    fit: "Tuned by listening to labelled recordings: whether breathing is heard; the reference value is a pilot setting chosen from breath anatomy and checked on 23 listened breath recordings; a relative level, no absolute dBFS, not fitted to labels."
  - path: ["modulation", "active_rise_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Broadband envelope level over its floor that bounds the active span used by the modulation reading."
    fit: "Tuned by listening to labelled recordings: how much of a breath recording holds activity; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["modulation", "min_duration_s"]
    kind: c
    required: true
    unit: "s"
    means: "Shortest recording or task extent on which the breathing-modulation reading is taken."
    fit: "Tuned by listening to labelled recordings: how long a span a modulation reading needs; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["modulation", "reference_band_hz"]
    kind: c
    required: true
    unit: "Hz range [min, max] (modulation frequency)"
    means: "Modulation-frequency band that breathing-rate and syllabic-rate modulation are referenced to."
    fit: "Tuned by listening to labelled recordings: breathing versus speech modulation; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["review", "cycle_cv_min"]
    kind: c
    required: true
    unit: "coefficient of variation"
    means: "Breathing-cycle variation at or above which a train counts as irregular for the low-confidence flag."
    fit: "Tuned by listening to labelled recordings: which kept breath recordings are uncertain enough to review; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["review", "irregular_rise_db_max"]
    kind: c
    required: true
    unit: "dB"
    means: "An irregular breath train whose rise is at or under this is flagged low-confidence."
    fit: "Tuned by listening to labelled recordings: which kept breath recordings are uncertain enough to review; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["review", "min_phases"]
    kind: c
    required: true
    unit: "count"
    means: "Fewest breath phases a train needs to avoid the low-confidence flag."
    fit: "Tuned by listening to labelled recordings: which kept breath recordings are uncertain enough to review; no derivation written; the reference profile carries the value set on adult clinical speech."
  - path: ["review", "weak_rise_db_max"]
    kind: c
    required: true
    unit: "dB"
    means: "A breath train whose rise is at or under this is flagged low-confidence as weak."
    fit: "Tuned by listening to labelled recordings: which kept breath recordings are uncertain enough to review; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "band_edges_hz"]
    kind: c
    required: true
    unit: "list of Hz"
    means: "Subband edges over which the breath train's envelopes are computed."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "burst_s"]
    kind: c
    required: true
    unit: "s range [min, max]"
    means: "Shortest and longest duration of one breath burst."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "coherence_min"]
    kind: c
    required: true
    unit: "fraction (0-1)"
    means: "Share of subbands that must rise together for a breath burst."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "coherence_window_s"]
    kind: c
    required: true
    unit: "s"
    means: "Window within which subbands must rise together for a breath burst."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "continue_db"]
    kind: c
    required: true
    unit: "dB"
    means: "The breath extent runs on to a following speech onset standing this far over the floor."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "distance_quick_s"]
    kind: c
    required: true
    unit: "s"
    means: "Least spacing between breath bursts in a task that asks for quick breaths."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "distance_s"]
    kind: c
    required: true
    unit: "s"
    means: "Least spacing between breath bursts in every other breath task."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "edge_min_s"]
    kind: c
    required: true
    unit: "s"
    means: "Shortest edge phase (raised at the file's start or still raised at its end) that counts."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "envelope_smooth_s"]
    kind: c
    required: true
    unit: "s"
    means: "Moving-mean window on the combined robust-z breath envelope."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "flatness_min"]
    kind: c
    required: true
    unit: "fraction (0-1)"
    means: "Least spectral flatness a breath burst must show to count as noise-like breath."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "floor_percentile"]
    kind: c
    required: true
    unit: "percentile"
    means: "Percentile of the raw broadband level taken as the breath train's floor."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "fs_mod"]
    kind: c
    required: true
    unit: "Hz"
    means: "Sampling rate of the breath train's subband envelopes."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "gap_cycles"]
    kind: c
    required: true
    unit: "count (half-cycles)"
    means: "Gap, in breathing half-cycles, beyond which bursts start a new run (or gap_min_s if larger)."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "gap_min_s"]
    kind: c
    required: true
    unit: "s"
    means: "Gap beyond which breath bursts start a new run (or gap_cycles if larger)."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "noise_percentile"]
    kind: c
    required: true
    unit: "percentile"
    means: "Per-bin percentile used as the stationary noise estimate before breath detection."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "noise_subtract"]
    kind: c
    required: true
    unit: "fraction (0-1)"
    means: "Share of the stationary noise estimate subtracted from each bin."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "pad_s"]
    kind: c
    required: true
    unit: "s"
    means: "Padding each side of the breath train's hull in the task extent."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "prominence_min"]
    kind: c
    required: true
    unit: "robust-z units"
    means: "Least prominence of a breath burst in the combined envelope."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "prominence_range_frac"]
    kind: c
    required: true
    unit: "fraction (0-1)"
    means: "Alternative prominence floor as a share of the envelope's 5th-95th percentile range; the larger applies."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "rise_floor_db"]
    kind: c
    required: true
    unit: "dB"
    means: "Least peak level of a breath burst over the broadband floor."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "rise_z"]
    kind: c
    required: true
    unit: "robust-z units"
    means: "Rise within the coherence window for a subband to count as rising."
    fit: "Tuned by listening to labelled recordings: where the breath bursts are and how many phases the participant breathed; the reference profile carries a value fitted on adult clinical speech."
  - path: ["train", "smooth_s"]
    kind: c
    required: true
    unit: "s"
    means: "Moving-median window applied to each subband level before breath bursts are found."
