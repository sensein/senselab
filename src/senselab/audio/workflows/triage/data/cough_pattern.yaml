# The cough-onset measure (cough_pattern.py) and the cough tasks it decides.
# Read off PREPROCESS's stored spectrogram_narrowband (pre-emphasised stream); AIRWAY's events, HeAR and
# YAMNet are context.
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 1
measure:
  band_edges_hz: [150.0, 300.0, 500.0, 800.0, 1300.0, 2000.0, 3000.0, 4000.0, 5500.0, 7800.0]
  smooth_s:                    # profile value (data/profile_values.yaml)
  floor_percentile:            # profile value (data/profile_values.yaml)
  digital_silence_db: -100.0   # summed band power at or below: digital silence
  rise_s:                      # profile value (data/profile_values.yaml)
  rise_db:                     # profile value (data/profile_values.yaml)
  band_rise_db:                # profile value (data/profile_values.yaml)
  coherence_min:               # profile value (data/profile_values.yaml)
  min_gap_s:                   # profile value (data/profile_values.yaml)
  gap_lookback_s:              # profile value (data/profile_values.yaml)
  gap_db:                      # profile value (data/profile_values.yaml)
  restart_rise_fraction:       # profile value (data/profile_values.yaml)
  peak_db:                     # profile value (data/profile_values.yaml)
  peak_window_s:                        # profile value (data/profile_values.yaml)
  tail_db:                     # profile value (data/profile_values.yaml)
  min_event_s:                          # profile value (data/profile_values.yaml)
  attach_s:                    # profile value (data/profile_values.yaml)
  train_drop_db:               # profile value (data/profile_values.yaml)
  word_pad_s:                  # profile value (data/profile_values.yaml)
  inhale_gap_s:                # profile value (data/profile_values.yaml)
  inhale_bridge_s:             # profile value (data/profile_values.yaml)
  inhale_max_s:                # profile value (data/profile_values.yaml)
  inhale_min_s:                         # profile value (data/profile_values.yaml)
  inhale_db:                  # profile value (data/profile_values.yaml)
  inhale_extend_db:           # profile value (data/profile_values.yaml)
# The cough-task extent: from pre_s before the first onset to the end of the last event, never across a
# speech word.
extent:
  pre_s:                                # profile value (data/profile_values.yaml)
  post_s: # profile value (data/profile_values.yaml)
# The review band: the reading is low-confidence where the decision differs between the measure with
# its rise and coherence thresholds raised by these margins and with them lowered by the same margins.
review:
  rise_margin_db:                       # profile value (data/profile_values.yaml)
  coherence_margin:                     # profile value (data/profile_values.yaml)
