# QUALITY's join: interference, faults, stream agreement and capture, read against each task span
# by time overlap (quality_join.py).
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 3
abut_s:                           # profile value (data/profile_values.yaml)
interference:                     # a non-speech source over a task span; only an in-span one can review. Another voice is speech: the fold attributes it
  impulse:                        # BACKGROUND's impulses: a click, knock or handling noise
    decides:                      # profile value (data/profile_values.yaml)
faults:                           # a capture fault touching a task span reviews; elsewhere it is an annotation
  shutoff:
    min_s:                        # profile value (data/profile_values.yaml)
    abut_s:                       # profile value (data/profile_values.yaml)
    sounding_db:                  # profile value (data/profile_values.yaml)
    before_s:                     # profile value (data/profile_values.yaml)
    event_kinds:                  # profile value (data/profile_values.yaml)
    decides:                            # profile value (data/profile_values.yaml)
  gate:                           # a dead stretch the signal had already decayed into: a recorder's noise gate
    min_s:                              # profile value (data/profile_values.yaml)
    decides:                            # profile value (data/profile_values.yaml)
  dropout:
    min_s:                        # profile value (data/profile_values.yaml)
    decides:                            # profile value (data/profile_values.yaml)
  clip:
    min_s:                        # profile value (data/profile_values.yaml)
    decides:                            # profile value (data/profile_values.yaml)
  discontinuity:
    min_s:                              # profile value (data/profile_values.yaml)
    decides:                      # profile value (data/profile_values.yaml)
streams:                          # the raw stream's task events re-read on the enhanced stream
  snr_low_db:                     # profile value (data/profile_values.yaml)
  lost_fraction:                  # profile value (data/profile_values.yaml)
  decides:                        # profile value (data/profile_values.yaml)
capture:                          # nothing captured: no activity, or only the room at the session's level
  level_rel_db_max:               # profile value (data/profile_values.yaml)
