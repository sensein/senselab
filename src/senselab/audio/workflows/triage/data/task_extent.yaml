# Where a task's extent begins and ends, and whether it holds the whole task (task_extent.py).
# Values left empty are a dataset profile's (data/profile_values.yaml); senselab's adult_clinical_speech profile
# carries a set, each with its derivation.
version: 3
growth:                          # A1: breath and cough extents grow outward from the task cluster
  enabled:                       # profile value (data/profile_values.yaml)
  families: [breath, cough]      # the event kinds that grow
  k:                             # profile value (data/profile_values.yaml)
  gap_floor_s:                   # profile value (data/profile_values.yaml)
  single_event_gap: cluster      # a one-event cluster's gap is its family's clustering gap (task_events.yaml)
  diarized_turn_min_s:           # profile value (data/profile_values.yaml)
  cross_speech:                  # profile value (data/profile_values.yaml)
modulation:                      # A1: envelope-modulation event detector beside the breath type test
  enabled:                              # profile value (data/profile_values.yaml)
  band_hz: [0.1, 1.2]            # the breathing band, as task_events.yaml rhythm.band_hz
  rate_hz:                       # profile value (data/profile_values.yaml)
  prominence_db:                 # profile value (data/profile_values.yaml)
  margin_db:                     # profile value (data/profile_values.yaml)
  min_s: 0.3                     # a lobe's frames over the margin span at least this (as breath_pattern.yaml event_min_s)
  max_s: 4.0                     # and at most this
edges:                           # round 2: a breath extent's first and last events run out to their envelope's boundary
  enabled:                       # profile value (data/profile_values.yaml)
  margin_db:                     # profile value (data/profile_values.yaml)
  bridge_s:                      # profile value (data/profile_values.yaml)
  max_s:                         # profile value (data/profile_values.yaml)
trim:                            # A2: the extent ends at the task's own acoustic onset and offset
  enabled:                       # profile value (data/profile_values.yaml)
  voice:
    onset_voiced_s:              # profile value (data/profile_values.yaml)
  ddk:
    agreed_run_min:              # profile value (data/profile_values.yaml)
    edge_duration_ratio:         # profile value (data/profile_values.yaml)
    kept_share_min:              # profile value (data/profile_values.yaml)
    margin_intervals:            # profile value (data/profile_values.yaml)
  airway:
    pad_s:                       # profile value (data/profile_values.yaml)
count_in:                        # A3: a voice task's declared count-in is inside its extent
  enabled:                       # profile value (data/profile_values.yaml)
  gap_max_s:                     # profile value (data/profile_values.yaml)
continuity:                      # A3: an interrupted vowel is spanned by phonation continuity
  enabled:                       # profile value (data/profile_values.yaml)
  semitones:                     # profile value (data/profile_values.yaml)
  voiced_min_s:                  # profile value (data/profile_values.yaml)
  gap_max_s:                     # profile value (data/profile_values.yaml)
  tail_s:                        # profile value (data/profile_values.yaml)
  runs_max:                      # profile value (data/profile_values.yaml)
parts:                           # round 2: a voice task done in several separate phonations is spanned whole
  enabled:                       # profile value (data/profile_values.yaml)
  hold_min_s:                    # profile value (data/profile_values.yaml)
  voiced_fraction_min:           # profile value (data/profile_values.yaml)
  gap_max_s:                     # profile value (data/profile_values.yaml)
stimulus_edges:                  # A4: substituted edge tokens a recogniser read as the stimulus are task speech
  enabled:                       # profile value (data/profile_values.yaml)
completeness:                    # A5: extent_complete
  reviews:                       # profile value (data/profile_values.yaml)
  voice_hold_min_s:              # profile value (data/profile_values.yaml)
  onset_tolerance_s:             # profile value (data/profile_values.yaml)
atypical:                        # E2: an attempted task whose events fall outside its family's corpus range
  cough_event_s_max:              # profile value (data/profile_values.yaml)
  ddk_rate_hz:                    # profile value (data/profile_values.yaml)
