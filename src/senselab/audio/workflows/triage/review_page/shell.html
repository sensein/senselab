<script>
try {
  var chosen = window.localStorage.getItem('recording-vectors-theme');
  if (chosen === 'light' || chosen === 'dark') document.documentElement.setAttribute('data-theme', chosen);
} catch (e) { /* storage unavailable: the system preference stands */ }
</script>
<style>
/*@INLINE:viewer/styles.css@*/
/*@INLINE:review.css@*/
/*@MARKSTYLE@*/
</style>
</head>
<body class="review">

<header class="rv-top">
  <h1>@TITLE@</h1>
  <nav class="rv-tabs" role="tablist">
    <button type="button" class="rv-tab on" data-tab="explore" role="tab">explore</button>
    <button type="button" class="rv-tab" data-tab="review" role="tab">review</button>
    <button type="button" class="rv-tab" data-tab="decisions" role="tab">decisions <span id="rv-dec-n">0</span></button>
  </nav>
  <span id="rv-selected" class="rv-count"></span>
  <span id="rv-mode" class="rv-mode"></span>
  <span class="grow"></span>
  <button id="rv-theme" type="button">theme: system</button>
</header>

<section id="tab-explore" class="rv-panel">
  <div class="rv-controls">
    <label>axes for <select id="rv-axes-group"></select></label>
    <label>colour by <select id="rv-colour"></select></label>
    <button id="rv-clear" type="button">clear brushes</button>
    <span id="rv-brushes" class="rv-note"></span>
  </div>
  <div class="rv-pc">
    <div id="rv-axis-labels" class="rv-axis-labels"></div>
    <canvas id="rv-pc"></canvas>
    <canvas id="rv-pc-overlay"></canvas>
  </div>
  <p class="rv-note">Drag along an axis to brush it; click a line to open that recording. Brushes, the
  review facets and the search narrow one shared selection.</p>
</section>

<section id="tab-review" class="rv-panel" hidden>
  <aside class="rv-facets">
    <input id="rv-search" type="search" placeholder="search stem or transcript">
    <input id="rv-who" type="search" placeholder="participant or session id">
    <button id="rv-facets-clear" type="button">clear facets</button>
    <div id="rv-facet-list"></div>
  </aside>
  <div class="rv-list">
    <div id="rv-list-head" class="rv-note"></div>
    <ol id="rv-list"></ol>
    <button id="rv-more" type="button" hidden>more</button>
  </div>
  <article id="rv-detail" class="rv-detail">
    <p class="rv-note">Choose a recording. <b>j</b>/<b>k</b> step through the selection.</p>
  </article>
</section>

<section id="tab-decisions" class="rv-panel" hidden>
  <div class="rv-controls">
    <button id="rv-export" type="button">export JSON</button>
    <label class="rv-import">import JSON… <input id="rv-import" type="file" accept=".json,application/json"></label>
    <span id="rv-dec-summary" class="rv-note"></span>
  </div>
  <table class="rv-dec-table">
    <thead><tr><th>recording</th><th>family</th><th>pipeline</th><th>reviewer</th><th>note</th><th>when</th><th></th></tr></thead>
    <tbody id="rv-dec-body"></tbody>
  </table>
</section>

</html>
