# Map from two-recognizer measurements to the primary transcript's WER (fillers excluded on all sides).
# Primary nyralabs/CrisperWhisper2.0_turbo (MPS fp16), secondary Qwen/Qwen3-ASR-1.7B (MPS fp16, 30 s chunks).
# Fitted on 285 windows of ~30 s (cut outside reference utterances) from six AMI test-set headset-mix
# recordings: EN2002a/EN2002b with all speakers, with the two most talkative speakers only, and with pink
# noise (5 dB, 10 dB); 3.5 h of audio, 18,082 scored primary words, true window WER 0.01-1.00
# (median 0.47). Word-weighted least squares. Derivation, leave-one-recording-out checks and the
# per-recording table: specs/20261017-104000-asr-apple-silicon/design.md, section 5, regenerated by
# specs/20261017-104000-asr-apple-silicon/fit_calibration.py.
name: crisperwhisper2-turbo_vs_qwen3-asr-1.7b_ami
version: 1
derivation: specs/20261017-104000-asr-apple-silicon/design.md#5-two-system-accuracy-estimate
# Highest confidence below which a primary word is wrong at least half the time (cumulative), in 0.05 steps.
low_confidence_threshold: 0.45
model:
  # estimated_wer = intercept + disagreement * d + one_minus_confidence * (1 - mean word confidence)
  # Leave-one-recording-out: Pearson r 0.949, word-weighted MAE 0.067.
  with_confidence:
    intercept: 0.0776
    disagreement: 0.8791
    one_minus_confidence: 0.1335
    residual_quantile: 0.831   # 80th percentile of |LOO residual| * sqrt(n_primary_words)
  # Used when the primary carries no word confidences. Leave-one-recording-out: r 0.948, MAE 0.067.
  confidence_free:
    intercept: 0.0833
    disagreement: 0.9267
    residual_quantile: 0.857
interval:
  coverage: 0.8   # nominal; leave-one-recording-out coverage measured 0.789 for both models
