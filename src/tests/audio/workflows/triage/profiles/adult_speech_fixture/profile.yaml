# A test fixture: a real adult clinical-speech dataset's triage profile, the data and settings triage was built and
# fitted on, extracted on 2026-10-22 and kept with each plan step's changes through step 10; renamed for the tests on
# 2026-11-06 (plan step 8). The tests that use it read its tasks and values.
name: adult-speech-fixture
extends: senselab:adult_clinical_speech   # the detector and model tuning it shares with any adult clinical speech dataset
version: "2026-10-22"
provenance:
  snapshot_of: an adult clinical-speech dataset's profile (62,550 recordings), kept through plan step 10
  extracted_from: senselab alpha 98c8048b6
  fitted_on: triage campaigns r8 to r37 and the owner's listening sessions, per each file's derivation comments
config: config.yaml
files:
  airway_event_tokens.yaml: airway_event_tokens.yaml
  recruited_conditions: recruited_conditions
  cohort_stage.yaml: cohort_stage.yaml
  decision_reasons.yaml: decision_reasons.yaml
  detector_profile: detector_profile
  discard_replaced_task.yaml: discard_replaced_task.yaml
  evaluation: evaluation
  quality_join.yaml: quality_join.yaml
  review_policy.txt: review_policy.txt
  session_background.yaml: session_background.yaml
  task_extent.yaml: task_extent.yaml
  task_guidance.yaml: task_guidance.yaml
  task_lexicon: task_lexicon
  task_minimum_duration.yaml: task_minimum_duration.yaml
  task_speech.yaml: task_speech.yaml
  tasks.yaml: tasks.yaml
  time_release.yaml: time_release.yaml
