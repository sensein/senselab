# The Bridge2AI-Voice adult triage profile: the data and settings triage was built and fitted on.
#
# Extracted on 2026-10-22 from senselab alpha 98c8048b6 (triage data/ and data/config/default.yaml), unchanged, so a
# run with this profile decides exactly as triage did before profiles existed. Which file and key moved, and why, is
# in specs/20261022-triage-dataset-profile/inventory.md. Kept here as a test fixture until the profile moves to
# b2aiprep (plan step 6).
name: bridge2ai-voice-adult
version: "2026-10-22"
provenance:
  dataset: Bridge2AI-Voice adult release, bids_adult_2026_09_04 (62,550 recordings)
  extracted_from: senselab alpha 98c8048b6
  fitted_on: triage campaigns r8 to r37 and the owner's listening sessions, per each file's derivation comments
config: config.yaml
files:
  airway_event_requirements.yaml: airway_event_requirements.yaml
  airway_event_tokens.yaml: airway_event_tokens.yaml
  asr_degenerate.yaml: asr_degenerate.yaml
  breath_pattern.yaml: breath_pattern.yaml
  cohort_conditions: cohort_conditions
  cohort_stage.yaml: cohort_stage.yaml
  cough_pattern.yaml: cough_pattern.yaml
  decision_reasons.yaml: decision_reasons.yaml
  detector_profile: detector_profile
  discard_contested.yaml: discard_contested.yaml
  discard_replaced_task.yaml: discard_replaced_task.yaml
  evaluation: evaluation
  quality_join.yaml: quality_join.yaml
  session_background.yaml: session_background.yaml
  speaker_vector_profile: speaker_vector_profile
  task_content.yaml: task_content.yaml
  task_events.yaml: task_events.yaml
  task_extent.yaml: task_extent.yaml
  task_lexicon: task_lexicon
  task_minimum_duration.yaml: task_minimum_duration.yaml
