# The Bridge2AI-Voice adult settings: what is B2AI's own, merged over senselab's packaged triage config and the
# adult_clinical_speech reference profile this profile extends (plan step 5c). Every value is the one triage used
# before profiles existed (senselab alpha 98c8048b6). The owner's policy carries its date; the derivations are in
# specs/20260817-triage-workflow-dag/config-derivations.md.
speech:
  target_match_cosine: 0.231 # differs from senselab's 0.25: midpoint of same-speaker p5 and between-speaker p95 at 1.0 s windows on B2AI's speaker vectors
verdict:
  llm_reset_redactions: true             # owner, 2026-09-27: a reading's release entries unmask exactly the words they name
  condition_categories: [CONDITION]      # owner, 2026-10-03 (policy v7): a listed health condition is never masked and never withholds
  person_name_review_flags: true         # owner, 2026-10-03 (policy v7): a masked person's name flags for a human's review of name tags
  trim_protected_categories: [PERSON, NAME, LOCATION, LOC]  # owner, 2026-09-27: a marked word written as a proper noun is never trimmed
  recruited_conditions: bridge2ai_voice_adult_2026-09-04       # the study's recruited conditions (recruited_conditions/)
  llm_second_speaker_flags: true         # owner, 2026-09-27: a reading that heard more than one speaker flags the recording for review
  llm_contradiction_flags: true          # owner, 2026-09-28: a flagged reading that names no words flags the recording for review
  llm_instructions_spoken_flags: true    # owner, 2026-10-01: a reading quoting the task's instructions spoken in the recording flags for review
  uncomputed_reading_flags: true         # owner, 2026-09-29: a conformance reading that should exist and does not flags for review
  second_opinion_disagreement_flags: true  # owner, 2026-10-01: a confident second-opinion disagreement with the reviewer flags for review
  llm_redaction_withholds: false         # a reading of residue does not withhold a recording REDACT passed (unfitted)
  gates:
    by_family:                           # per-task gate bounds, r8
      rainbow-passage:
        content_omission_fraction_max: 0.1
      caterpillar-passage:
        content_omission_fraction_max: 0.1
      word-color-stroop:
        content_omission_fraction_max: 0.2
taxonomy:
  ruleset:
    emptiness:
      active_s_max: 0.0                  # owner's rule (config-derivations.md §taxonomy): seconds of activity BACKGROUND may read over the floor in a recording that carried nothing
pii:
  name_words_max: 1                      # owner, 2026-09-28: a name, place or organisation finding of two or more words keeps only its proper nouns
branch:
  phoneme_place_classes:
    alveolar: [t, d, r]                  # `r` admitted for the buttercup tasks' flap (diadochokinesis-buttercup)
redaction:
  name_approvals: {}                     # owner, 2026-10-03 (policy v7): recording file stem -> person names a human approved for release
  fill: silence                          # owner-directed (config-derivations.md §redaction): what replaces redacted audio: silence, noise or bleep
